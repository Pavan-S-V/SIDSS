   TOP SKILLS
===================================================== */

function renderTopSkills(skills) {

  const container =
    document.getElementById('topSkillsList');


  if (!skills || !skills.length) {

    container.innerHTML =
      '<span class="skills-empty">No skill data available.</span>';

    return;

  }


  container.innerHTML = `

    <div
      class="top-skill-chip skill-filter-chip active"
      onclick="filterByTopSkill('ALL', this)">

      <span>
        ⚡ All Skills
      </span>

      <strong>
        ${window.sidssSkillsRecords.length}
      </strong>

    </div>

    ${skills.map(function(item) {

      const safeSkill =
        String(item.skill || '')
          .replace(/\\/g, '\\\\')
          .replace(/'/g, "\\'");

      return `

        <div
          class="top-skill-chip skill-filter-chip"
          onclick="filterByTopSkill('${safeSkill}', this)">

          <span>
            ⚡ ${escapeHtml(item.skill)}
          </span>

          <strong>
            ${escapeHtml(item.count)}
          </strong>

        </div>

      `;

    }).join('')}

  `;

}

function filterByTopSkill(skill, clickedChip) {

  const allRecords =
    window.sidssSkillsRecords || [];


  let filteredRecords;


  if (skill === 'ALL') {

    filteredRecords = allRecords;

  } else {

    filteredRecords =
      allRecords.filter(function(record) {

        return String(record.skill || '')
          .trim()
          .toLowerCase() ===
          String(skill)
            .trim()
            .toLowerCase();

      });

  }


  // Display only matching students
  displaySkillsRecords(filteredRecords);


  // Remove active state from all chips
  document
    .querySelectorAll('.skill-filter-chip')
    .forEach(function(chip) {

      chip.classList.remove('active');

    });


  // Highlight selected chip
  if (clickedChip) {

    clickedChip.classList.add('active');

  }


  // Scroll to Student Skills Directory
  const table =
    document.getElementById('skillsTableBody');

  if (table) {

    table.scrollIntoView({
      behavior: 'smooth',
      block: 'start'
    });

  }

}

/* =====================================================
   DISPLAY RECORDS
===================================================== */

function displaySkillsRecords(records) {

  const body =
    document.getElementById(
      'skillsTableBody'
    );


  if (!records.length) {

    body.innerHTML = `

      <tr>

        <td
          colspan="8"
          class="empty-table">

          No skill records found.

        </td>

      </tr>

    `;

    return;

  }


  body.innerHTML =
    records.map(function(record) {

      const initial =
        record.name
          ? record.name.charAt(0).toUpperCase()
          : 'S';


      const level =
        String(record.level || '')
          .toLowerCase();


      let levelClass =
        'skill-beginner';


      if (level === 'advanced') {

        levelClass =
          'skill-advanced';

      }

      else if (
        level === 'intermediate'
      ) {

        levelClass =
          'skill-intermediate';

      }


      const verified =
        String(record.verified || '')
          .toLowerCase() === 'yes';


      return `

        <tr>

          <td>

            <div class="student-name-cell">

              <div class="student-avatar">
                ${escapeHtml(initial)}
              </div>

              <div>

                <strong>
                  ${escapeHtml(
                    record.name ||
                    'Student'
                  )}
                </strong>

                <span>
                  ${escapeHtml(
                    record.department ||
                    ''
                  )}
                </span>

              </div>

            </div>

          </td>


          <td class="usn-cell">

            ${escapeHtml(
              record.usn || '-'
            )}

          </td>


          <td>

            <strong class="skill-name">

              ${escapeHtml(
                record.skill || '-'
              )}

            </strong>

          </td>


          <td>

            <span class="${levelClass}">

              ${escapeHtml(
                record.level || '-'
              )}

            </span>

          </td>


          <td>

            <span class="${
              verified
                ? 'skill-verified'
                : 'skill-unverified'
            }">

              ${
                verified
                  ? '● Verified'
                  : '○ Not Verified'
              }

            </span>

          </td>


          <td>

            ${escapeHtml(
              record.experience || 0
            )}
            ${
              Number(record.experience) === 1
                ? 'Year'
                : 'Years'
            }

          </td>


          <td>

            ${escapeHtml(
              record.lastUpdated || '-'
            )}

          </td>


          <td>

            <button
              class="view-student-button"
              onclick="openSkillsStudent(
                '${escapeHtml(record.usn)}'
              )">

              View →

            </button>

          </td>

        </tr>

      `;

    }).join('');


  document
    .getElementById(
      'skillsRecordCount'
    )
    .textContent =
      records.length +
      ' skill records';

}

function trainingKPI(
  title,
  value,
  subtitle,
  icon
) {

  let filterType = 'all';

  if (title === 'Students') {
    filterType = 'students';
  }

  else if (title === 'Total Records') {
    filterType = 'all';
  }

  else if (title === 'Completed') {
    filterType = 'completed';
  }

  else if (title === 'In Progress') {
    filterType = 'inprogress';
  }


  return `

    <div
      class="training-kpi-card clickable-kpi"
      onclick="filterTrainingKPI('${filterType}')"
    >

      <div class="training-kpi-top">

        <div class="training-kpi-icon">
          ${icon}
        </div>

        <span class="kpi-live">LIVE</span>

      </div>


      <strong>
        ${escapeHtml(value || 0)}
      </strong>


      <h4>
        ${escapeHtml(title)}
      </h4>


      <p>
        ${escapeHtml(subtitle)}
      </p>

    </div>

  `;

}


function filterTrainingKPI(type) {

  const allRecords =
    window.sidssTrainingRecords || [];

  let filtered = allRecords;


  // TOTAL RECORDS
  if (type === 'all') {

    filtered = allRecords;

  }


  // UNIQUE STUDENTS
  else if (type === 'students') {

    const seen = new Set();

    filtered = allRecords.filter(function(record) {

      const usn =
        String(record.usn || '')
          .trim()
          .toLowerCase();

      if (!usn || seen.has(usn)) {
        return false;
      }

      seen.add(usn);

      return true;

    });

  }


  // COMPLETED
  else if (type === 'completed') {

    filtered = allRecords.filter(function(record) {

      return String(
        record.status || ''
      )
        .trim()
        .toLowerCase() === 'completed';

    });

  }


  // IN PROGRESS
  else if (type === 'inprogress') {

    filtered = allRecords.filter(function(record) {

      return String(
        record.status || ''
      )
        .trim()
        .toLowerCase() === 'in progress';

    });

  }


  // Clear existing search
  const search =
    document.getElementById('trainingSearch');

  if (search) {
    search.value = '';
  }


  // Display ONLY filtered records
  displayTrainingRecords(filtered);


  // Scroll to records
  const table =
    document.getElementById(
      'trainingTableBody'
    );

  if (table) {

    table.scrollIntoView({
      behavior: 'smooth',
      block: 'start'
    });

  }

}

/* =====================================================
   SEARCH
===================================================== */

function filterTraining() {

  const search =
    document
      .getElementById('trainingSearch')
      .value
      .toLowerCase()
      .trim();


  if (!search) {

    displayTrainingRecords(
      window.sidssTrainingRecords
    );

    return;

  }


  const filtered =
    window.sidssTrainingRecords
      .filter(function(record) {

        return Object
          .values(record)
          .join(' ')
          .toLowerCase()
          .includes(search);

      });


  displayTrainingRecords(filtered);

}

/* =====================================================
   PLACEMENT KPI INTERACTIVE FILTERS
===================================================== */

function filterPlacementKPI(type) {

  const records = window.sidssPlacementRecords || [];

  if (!records.length) {
    return;
  }

  let filtered = [];
  let title = 'Placement Records';


  // 1. ELIGIBLE STUDENTS
  if (type === 'eligible') {

    filtered = records.filter(function(record) {

      return String(record.eligibility || '')
        .trim()
        .toLowerCase() === 'yes';

    });

    title = 'Eligible Students';
  }


  // 2. PLACED STUDENTS
  else if (type === 'placed') {

    filtered = records.filter(function(record) {

      return String(record.offerStatus || '')
        .trim()
        .toLowerCase() === 'yes';

    });

    title = 'Placed Students';
  }


  // 3. AVERAGE READINESS
  else if (type === 'readiness') {

    filtered = [...records].sort(function(a, b) {

      return Number(b.readiness || 0) -
             Number(a.readiness || 0);

    });

    title = 'Students Ranked by Placement Readiness';
  }


  // 4. HIGHEST PACKAGE
  else if (type === 'package') {

    const highestPackage = Math.max(
      ...records.map(function(record) {
        return Number(record.packageLPA || 0);
      })
    );

    filtered = records.filter(function(record) {

      return Number(record.packageLPA || 0) ===
             highestPackage;

    });

    title =
      'Highest Package — ' +
      highestPackage.toFixed(1) +
      ' LPA';
  }


  // DISPLAY ONLY FILTERED RECORDS
  displayPlacementRecords(filtered);


  // FILTER BANNER
  showPlacementFilterBanner(
    title,
    filtered.length
  );


  // SCROLL TO RESULT TABLE
  const table =
    document.querySelector(
      '.students-table-card'
    );

  if (table) {

    table.scrollIntoView({
      behavior: 'smooth',
      block: 'start'
    });

  }

}

function showPlacementFilterBanner(
  title,
  count
) {

  let banner =
    document.getElementById(
      'placementFilterBanner'
    );


  if (!banner) {

    banner =
      document.createElement('div');

    banner.id =
      'placementFilterBanner';

    banner.className =
      'placement-filter-banner';


    const table =
      document.querySelector(
        '.students-table-card'
      );


    if (table) {

      table.parentNode.insertBefore(
        banner,
        table
      );

    }

  }


  banner.innerHTML = `

    <div>

      <span>
        VIEWING
      </span>

      <strong>
        ${escapeHtml(title)}
      </strong>

      <small>
        ${count} student record${count === 1 ? '' : 's'}
      </small>

    </div>


    <button
      onclick="resetPlacementFilter()">

      Show All Records ×

    </button>

  `;

}

   OPEN REPORT
===================================================== */

function openSIDSSReport(type) {

  /*
     IMPORTANT:
     We call the existing working SIDSS modules.
     We do NOT duplicate their data.
  */


  if (type === 'academic') {

    loadAcademics();
    return;

  }


  if (type === 'attendance') {

    loadAttendance();
    return;

  }


  if (type === 'placement') {

    loadPlacement();
    return;

  }


  if (type === 'skills') {

    loadSkills();
    return;

  }


  if (type === 'training') {

    /*
       Your project may use loadTraining()
       for Training & Certificates.
    */

    if (typeof loadTraining === 'function') {

      loadTraining();

    } else {

      showPageError(
        'Training & Certificates module is not available.'
      );

    }

    return;

  }


  if (type === 'student') {

    openStudentReportPanel();
    return;

  }

}

function renderEventTypes(items) {

  const container =
    document.getElementById(
      'eventTypeList'
    );


  if (!container) {
    return;
  }


  if (!items.length) {

    container.innerHTML =
      '<span class="events-empty">No event data available.</span>';

    return;

  }


  container.innerHTML =
    items.map(function(item) {

      return `

        <div
          class="event-type-chip"
          onclick="filterEventsByType(
            '${escapeHtml(item.type)}'
          )"
        >

          <span>
            ${escapeHtml(item.type)}
          </span>

          <strong>
            ${escapeHtml(item.count)}
          </strong>

        </div>

      `;

    }).join('');

}

function displayEventRecords(records) {

  const body =
    document.getElementById(
      'eventsTableBody'
    );


  if (!body) {
    return;
  }


  if (!records.length) {

    body.innerHTML = `

      <tr>

        <td
          colspan="11"
          class="empty-table"
        >

          No events found for this selection.

        </td>

      </tr>

    `;


    updateEventRecordCount(0);

    return;

  }


  body.innerHTML =
    records.map(function(record) {

      const status =
        String(record.status || '')
          .trim()
          .toLowerCase();


      let statusClass =
        'event-status-default';


      if (status === 'completed') {

        statusClass =
          'event-status-completed';

      }

      else if (status === 'upcoming') {

        statusClass =
          'event-status-upcoming';

      }

      else if (
        status === 'ongoing' ||
        status === 'in progress'
      ) {

        statusClass =
          'event-status-ongoing';

      }


      const participants =
        Number(record.participants || 0);


      return `

        <tr>

          <td>

            <div class="event-name-cell">

              <div class="event-avatar">
                📅
              </div>

              <div>

                <strong>
                  ${escapeHtml(
                    record.eventName || 'Event'
                  )}
                </strong>

                <span>
                  ${escapeHtml(
                    record.remarks || ''
                  )}
                </span>

              </div>

            </div>

          </td>


          <td class="usn-cell">

            ${escapeHtml(
              record.eventId || '-'
            )}

          </td>


          <td>

            <span class="event-type-label">

              ${escapeHtml(
                record.eventType || '-'
              )}

            </span>

          </td>


          <td>

            ${escapeHtml(
              record.department || '-'
            )}

          </td>


          <td>

            ${escapeHtml(
              record.eventDate || '-'
            )}

          </td>


          <td>

            ${escapeHtml(
              record.venue || '-'
            )}

          </td>


          <td>

            ${escapeHtml(
              record.coordinator || '-'
            )}

          </td>


          <td>

            ${escapeHtml(
              record.eligibleStudents || '-'
            )}

          </td>


          <td>

            <strong class="event-participants">

              ${
                isNaN(participants)
                  ? '0'
                  : participants
              }

            </strong>

          </td>


          <td>

            <span class="${statusClass}">

              ● ${escapeHtml(
                record.status || '-'
              )}

            </span>

          </td>


          <td>

            <div class="event-action-buttons">

              <button
                type="button"
                class="view-student-button"
                onclick="viewEventDetails(
                  '${escapeHtml(record.eventId)}'
                )"
              >
                View →
              </button>


              ${
                currentUser &&
                currentUser.role === 'Department Admin'
                  ? `
                    <button
                      type="button"
                      class="event-edit-button"
                      onclick="openEditEventModal(
                        '${escapeHtml(record.eventId)}'
                      )"
                    >
                      Edit
                    </button>
                  `
                  : ''
              }

            </div>

          </td>
        </tr>

      `;

    }).join('');


  updateEventRecordCount(
    records.length
  );

}

function formatEventDateForInput(value) {

  if (!value) {
    return '';
  }

  const text =
    String(value).trim();


  // Already YYYY-MM-DD
  if (
    /^\d{4}-\d{2}-\d{2}$/.test(text)
  ) {

    return text;

  }


  const date =
    new Date(value);


  if (isNaN(date.getTime())) {
    return '';
  }


  const year =
    date.getFullYear();

  const month =
    String(
      date.getMonth() + 1
    ).padStart(2, '0');

  const day =
    String(
      date.getDate()
    ).padStart(2, '0');


  return (
    year +
    '-' +
    month +
    '-' +
    day
  );

}


function submitEditEvent(event) {

  event.preventDefault();


  const button =
    document.getElementById(
      'updateEventButton'
    );

  const message =
    document.getElementById(
      'editEventMessage'
    );


  button.disabled = true;
  button.textContent = 'Updating...';

  message.textContent = '';


  const eventData = {

    eventId:
      document
        .getElementById('editEventId')
        .value,

    eventName:
      document
        .getElementById('editEventName')
        .value.trim(),

    eventType:
      document
        .getElementById('editEventType')
        .value.trim(),

    eventDate:
      document
        .getElementById('editEventDate')
        .value,

    venue:
      document
        .getElementById('editEventVenue')
        .value.trim(),

    coordinator:
      document
        .getElementById('editEventCoordinator')
        .value.trim(),

    eligibleStudents:
      document
        .getElementById('editEventEligible')
        .value,

    participants:
      document
        .getElementById('editEventParticipants')
        .value,

    status:
      document
        .getElementById('editEventStatus')
        .value,

    remarks:
      document
        .getElementById('editEventRemarks')
        .value.trim()

  };


  google.script.run

    .withSuccessHandler(function(result) {

      if (
        !result ||
        result.success !== true
      ) {

        message.textContent =
          result && result.message
            ? result.message
            : 'Unable to update event.';

        button.disabled = false;
        button.textContent =
          'Update Event';

        return;

      }


      /*
       * Update local record immediately.
       * No getEventsData() call.
       * No loading screen.
       */

      const records =
        window.sidssEventRecords || [];


      const index =
        records.findIndex(
          function(record) {

            return String(
              record.eventId
            ).trim() ===
            String(
              eventData.eventId
            ).trim();

          }
        );


      if (index !== -1) {

        records[index] = {

          ...records[index],

          eventName:
            eventData.eventName,

          eventType:
            eventData.eventType,

          eventDate:
            eventData.eventDate,

          venue:
            eventData.venue,

          coordinator:
            eventData.coordinator,

          eligibleStudents:
            eventData.eligibleStudents,

          participants:
            Number(
              eventData.participants || 0
            ),

          status:
            eventData.status,

          remarks:
            eventData.remarks

        };

      }


      window.sidssEventRecords =
        records;


      // Update table immediately
      displayEventRecords(records);


      // Show success message inside modal
      if (message) {

        message.textContent =
          result.message ||
          'Event updated successfully.';

        message.style.color =
          '#22c55e';

        message.style.fontWeight =
          '600';

      }


      if (button) {

        button.disabled = true;

        button.textContent =
          'Updated ✓';

      }


      // Keep modal visible briefly so user
      // can see the success message
      setTimeout(function() {

        closeEditEventModal();

      }, 1200);


    })


    .withFailureHandler(function(error) {

      console.error(
        'Update Event Error:',
        error
      );


      message.textContent =
        error && error.message
          ? error.message
          : 'Unable to update event.';


      button.disabled = false;

      button.textContent =
        'Update Event';

    })


    .updateEvent(
      eventData,
      currentUser
    );

}

function submitNewEvent(event) {

  event.preventDefault();

  const button =
    document.getElementById('saveEventButton');

  const message =
    document.getElementById('addEventMessage');


  function showError(text) {

    console.error(text);

    if (message) {
      message.textContent = text;
      message.style.color = '#ff6b6b';
    }

    if (button) {
      button.disabled = false;
      button.textContent = 'Add Event';
    }

  }


  try {

    // GET REQUIRED FIELDS

    const nameEl =
      document.getElementById('newEventName');

    const typeEl =
      document.getElementById('newEventType');

    const dateEl =
      document.getElementById('newEventDate');

    const venueEl =
      document.getElementById('newEventVenue');

    const coordinatorEl =
      document.getElementById('newEventCoordinator');

    const participantsEl =
      document.getElementById('newEventParticipants');

    const statusEl =
      document.getElementById('newEventStatus');

    const remarksEl =
      document.getElementById('newEventRemarks');


    // ELIGIBLE STUDENTS:
    // support different IDs if your modal uses another one

    const eligibleEl =
      document.getElementById('newEventEligibleStudents') ||
      document.getElementById('newEventEligible') ||
      document.getElementById('eventEligibleStudents');


    // CHECK ONLY ACTUALLY REQUIRED ELEMENTS

    const missing = [];

    if (!nameEl) missing.push('Event Name');
    if (!typeEl) missing.push('Event Type');
    if (!dateEl) missing.push('Event Date');
    if (!venueEl) missing.push('Venue');
    if (!coordinatorEl) missing.push('Coordinator');
    if (!participantsEl) missing.push('Participants');
    if (!statusEl) missing.push('Status');


    if (missing.length > 0) {

      showError(
        'Missing form fields: ' +
        missing.join(', ')
      );

      return;
    }


    // DEPARTMENT COMES FROM LOGGED-IN USER

    const department =
      currentUser &&
      currentUser.department
        ? String(currentUser.department)
            .trim()
            .toUpperCase()
        : '';


    if (!department) {

      showError(
        'Unable to determine department.'
      );

      return;
    }


    // BUILD EVENT DATA

    const eventData = {

      eventName:
        nameEl.value.trim(),

      eventType:
        typeEl.value.trim(),

      department:
        department,

      eventDate:
        dateEl.value,

      venue:
        venueEl.value.trim(),

      coordinator:
        coordinatorEl.value.trim(),

      eligibleStudents:
        eligibleEl
          ? eligibleEl.value.trim()
          : '',

      participants:
        participantsEl.value,

      status:
        statusEl.value,

      remarks:
        remarksEl
          ? remarksEl.value.trim()
          : ''

    };


    // BASIC VALIDATION

    if (!eventData.eventName) {
      showError('Event Name is required.');
      return;
    }

    if (!eventData.eventType) {
      showError('Event Type is required.');
      return;
    }

    if (!eventData.eventDate) {
      showError('Event Date is required.');
      return;
    }

    if (!eventData.venue) {
      showError('Venue is required.');
      return;
    }

    if (!eventData.coordinator) {
      showError('Coordinator is required.');
      return;
    }


    console.log(
      'Sending Event Data:',
      eventData
    );


    // NOW SHOW SAVING

    if (button) {
      button.disabled = true;
      button.textContent = 'Saving...';
    }

    if (message) {
      message.textContent = 'Saving event...';
      message.style.color = '#8aa4c8';
    }


    // SAVE TO GOOGLE SHEET

    google.script.run

      .withSuccessHandler(function(result) {

        console.log(
          'Add Event Result:',
          result
        );


        if (!result) {

          showError(
            'No response received from server.'
          );

          return;
        }


        if (result.success !== true) {

          showError(
            result.message ||
            'Unable to add event.'
          );

          return;
        }


        // SUCCESS

        if (message) {

          message.textContent =
            result.message ||
            'Event added successfully.';

          message.style.color =
            '#00d9a6';

        }


        if (button) {

          button.disabled = true;

          button.textContent =
            'Added ✓';

        }


        // CREATE LOCAL RECORD

        const newRecord = {

          eventId:
            result.eventId || '',

          eventName:
            eventData.eventName,

          eventType:
            eventData.eventType,

          department:
            department,

          eventDate:
            eventData.eventDate,

          venue:
            eventData.venue,

          coordinator:
            eventData.coordinator,

          eligibleStudents:
            eventData.eligibleStudents,

          participants:
            Number(
              eventData.participants || 0
            ),

          status:
            eventData.status,

          remarks:
            eventData.remarks

        };


        if (
          !Array.isArray(
            window.sidssEventRecords
          )
        ) {

          window.sidssEventRecords = [];

        }


        // ADD NEW EVENT TO CURRENT PAGE

        window.sidssEventRecords.push(
          newRecord
        );


        // CLOSE MODAL

        setTimeout(function() {

          closeAddEventModal();


          // UPDATE TABLE WITHOUT RELOADING PAGE

          displayEventRecords(
            window.sidssEventRecords
          );


        }, 600);


      })


      .withFailureHandler(function(error) {

        console.error(
          'Add Event Server Error:',
          error
        );


        showError(
          'Server error: ' +
          (
            error && error.message
              ? error.message
              : String(error)
          )
        );

      })


      .addEvent(
        eventData,
        currentUser
      );


  } catch (error) {

    console.error(
      'submitNewEvent Error:',
      error
    );


    showError(
      'Form error: ' +
      (
        error.message ||
        String(error)
      )
    );

  }

}

/* =====================================================
   KPI FILTERS
===================================================== */

function filterEventsByKPI(type) {

  const records =
    window.sidssEventRecords || [];


  let filtered = [];
  let title = 'All Events';


  if (type === 'all') {

    filtered = [...records];

    title = 'All Events';

  }


  else if (type === 'upcoming') {

    filtered =
      records.filter(function(record) {

        return String(record.status || '')
          .trim()
          .toLowerCase() === 'upcoming';

      });

    title = 'Upcoming Events';

  }


  else if (type === 'completed') {

    filtered =
      records.filter(function(record) {

        return String(record.status || '')
          .trim()
          .toLowerCase() === 'completed';

      });

    title = 'Completed Events';

  }


  else if (type === 'participants') {

    filtered =
      [...records]
        .sort(function(a, b) {

          return (
            Number(b.participants || 0) -
            Number(a.participants || 0)
          );

        });

    title =
      'Events Ranked by Participation';

  }


  displayEventRecords(filtered);


  showEventFilterBanner(
    title,
    filtered.length
  );


  const table =
    document.querySelector(
      '.events-table'
    );


  if (table) {

    table.scrollIntoView({
      behavior: 'smooth',
      block: 'start'
    });

  }

}


/* =====================================================
   FILTER BY EVENT TYPE
===================================================== */

function filterEventsByType(type) {

  const records =
    window.sidssEventRecords || [];


  const filtered =
    records.filter(function(record) {

      return String(record.eventType || '')
        .trim()
        .toLowerCase() ===
        String(type || '')
          .trim()
          .toLowerCase();

    });


  displayEventRecords(filtered);


  showEventFilterBanner(
    type + ' Events',
    filtered.length
  );

}


/* =====================================================
   SEARCH + STATUS FILTER
===================================================== */

function applyEventFilters() {

  const records =
    window.sidssEventRecords || [];


  const searchInput =
    document.getElementById(
      'eventsSearch'
    );


  const statusInput =
    document.getElementById(
      'eventStatusFilter'
    );


  const search =
    searchInput
      ? searchInput.value
          .trim()
          .toLowerCase()
      : '';


  const status =
    statusInput
      ? statusInput.value
          .trim()
          .toLowerCase()
      : '';


  const filtered =
    records.filter(function(record) {

      const matchesSearch =
        !search ||
        Object.values(record)
          .join(' ')
          .toLowerCase()
          .includes(search);


      const recordStatus =
        String(record.status || '')
          .trim()
          .toLowerCase();


      let matchesStatus =
        !status;


      if (status === 'ongoing') {

        matchesStatus =
          (
            recordStatus === 'ongoing' ||
            recordStatus === 'in progress'
          );

      }

      else if (status) {

        matchesStatus =
          recordStatus === status;

      }


      return (
        matchesSearch &&
        matchesStatus
      );

    });


  displayEventRecords(filtered);


  if (search || status) {

    showEventFilterBanner(
      'Filtered Events',
      filtered.length
    );

  }

  else {

    hideEventFilterBanner();

  }

}

function placementInput(
  label,
  id,
  type,
  placeholder
) {

  return `

    <div>

      <label style="${placementLabelStyle()}">
        ${label}
      </label>

      <input
        type="${type}"
        id="${id}"
        placeholder="${placeholder}"
        style="${placementFieldStyle()}"
        ${
          label.indexOf('*') !== -1
            ? 'required'
            : ''
        }
        ${
          type === 'number'
            ? 'min="0" step="0.1"'
            : ''
        }
      >

    </div>

  `;

}

function submitNewSkill(event) {

  // Prevent normal form submission / white page
  event.preventDefault();


  const message =
    document.getElementById('addSkillMessage');

  const button =
    document.getElementById('saveSkillButton');


  const skill = {

    usn:
      document
        .getElementById('newSkillUSN')
        .value
        .trim()
        .toUpperCase(),

    skillName:
      document
        .getElementById('newSkillName')
        .value
        .trim(),

    skillLevel:
      document
        .getElementById('newSkillLevel')
        .value,

    verified:
      document
        .getElementById('newSkillVerified')
        .value,

    yearsExperience:
      document
        .getElementById('newSkillExperience')
        .value

  };


  // Validation
  if (
    !skill.usn ||
    !skill.skillName ||
    !skill.skillLevel
  ) {

    message.textContent =
      'Please fill all required fields.';

    return;
  }


  button.disabled = true;
  button.textContent = 'Saving...';

  message.textContent = '';


  google.script.run

    .withSuccessHandler(function(result) {

      button.disabled = false;
      button.textContent = 'Add Skill';


      // FAILED
      if (!result || !result.success) {

        message.textContent =
          result && result.message
            ? result.message
            : 'Unable to add skill.';

        return;
      }


      // SUCCESS MESSAGE INSIDE MODAL
      message.textContent =
        result.message ||
        '✓ Skill added successfully.';

      message.classList.remove('error');
      message.classList.add('success');

      button.textContent = 'Added ✓';


      // Wait so user can see success message
      setTimeout(function() {

        closeAddSkillModal();

        // Refresh skills page
        loadSkills();

      }, 1500);

    })


    .withFailureHandler(function(error) {

      button.disabled = false;
      button.textContent = 'Add Skill';


      alert(
        error && error.message
          ? 'Failed to add skill: ' + error.message
          : 'Failed to add skill. Something went wrong.'
      );

    })


    .addSkill(
      skill,
      currentUser
    );

}

      document
        .getElementById('newTrainingStatus')
        .value

  };


  if (
    !training.usn ||
    !training.category ||
    !training.certificateName ||
    !training.provider ||
    !training.completionDate ||
    !training.certificateID ||
    !training.status
  ) {

    message.textContent =
      'Please fill all required fields.';

    return false;

  }


  button.disabled = true;
  button.textContent = 'Saving...';

  message.textContent = '';


  google.script.run

    .withSuccessHandler(function(result) {


      if (
        !result ||
        !result.success
      ) {

        button.disabled = false;

        button.textContent =
          'Add Certificate';

        message.textContent =
          result && result.message
            ? result.message
            : 'Unable to add certificate.';

        return;

      }


      /* SUCCESS */

      message.textContent =
        '✓ Certificate added successfully.';

      message.style.color =
        '#00e6a8';


      button.textContent =
        'Added ✓';


      /*
       Do NOT immediately call loadTraining().
       Give Google Sheets a moment before
       requesting the updated dataset.
      */

      setTimeout(function() {

        closeAddTrainingModal();

        loadTraining();

      }, 1200);


    })


    .withFailureHandler(function(error) {

      button.disabled = false;

      button.textContent =
        'Add Certificate';


      message.textContent =
        error && error.message
          ? error.message
          : 'Unable to add certificate.';

    })


    .addTrainingCertificate(
      training,
      currentUser
    );


  return false;

}

function openFacultyMarksEntry() {

  // Immediately change sidebar highlight
  document
    .querySelectorAll(".sidebar-nav-item")
    .forEach(function(item) {

      item.classList.remove("active");

    });

  // Find Marks Entry sidebar item
  const marksEntryItem =
    Array.from(
      document.querySelectorAll(".sidebar-nav-item")
    ).find(function(item) {

      return item.textContent
        .trim()
        .includes("Marks Entry");

    });

  if (marksEntryItem) {

    marksEntryItem.classList.add("active");

  }

  // Open Marks Entry
  loadFacultyMarksEntry();
}


function returnToFacultyMarksEntry() {

  // If student records are already loaded, show them immediately
  if (
    window.facultyMarksRows &&
    Array.isArray(window.facultyMarksRows) &&
    window.facultyMarksRows.length > 0
  ) {

    showFacultyMarksEntry(window.facultyMarksRows);

  loadFacultyMarksEntry();
}

function calculateFacultyMarks() {

  function getNumber(id) {

    const element =
      document.getElementById(id);

    if (!element) {
      return 0;
    }

    const value =
      Number(element.value);

    return Number.isFinite(value)
      ? value
      : 0;
  }


  function setText(id, value) {

    const element =
      document.getElementById(id);

    if (element) {
      element.textContent = value;
    }
  }


  // ==========================================
  // READ MARKS
  // ==========================================

  const internal1 =
    getNumber("facultyInternal1");

  const internal2 =
    getNumber("facultyInternal2");

  const assignment =
    getNumber("facultyAssignment");

  const report =
    getNumber("facultyReport");

  const lab =
    getNumber("facultyLab");

  const external =
    getNumber("facultyExternal");


  // ==========================================
  // AVAILABLE COMPONENTS
  // ==========================================

  const assignmentElement =
    document.getElementById(
      "facultyAssignment"
    );

  const reportElement =
    document.getElementById(
      "facultyReport"
    );

  const labElement =
    document.getElementById(
      "facultyLab"
    );


  const hasAssignment =
    !!assignmentElement &&
    !assignmentElement.disabled;


  const hasReport =
    !!reportElement &&
    !reportElement.disabled;


  const hasLab =
    !!labElement &&
    !labElement.disabled;


  // ==========================================
  // INTERNAL REDUCED
  // ==========================================

  const internalReduced =
    Math.round(
      (internal1 + internal2) / 4
    );


  // ==========================================
  // CIE
  // ==========================================

  let cie =
    internalReduced;


  if (hasAssignment) {
    cie += assignment;
  }


  if (hasReport) {
    cie += report;
  }


  if (hasLab) {
    cie += lab;
  }


  cie =
    Math.min(
      Math.max(cie, 0),
      50
    );


  // ==========================================
  // EXTERNAL REDUCED
  // ==========================================

  const externalReduced =
    Math.round(
      external / 2
    );


  // ==========================================
  // RESULT AVAILABILITY
  // ==========================================
  //
  // External = 0
  // → Result not calculated
  //
  // External > 0
  // → Calculate Total + Result
  // ==========================================

  let total = null;
  let result = "-";


  if (external > 0) {

    total =
      cie + externalReduced;


    // ========================================
    // PASS RULE
    // ========================================
    //
    // External minimum = 35 / 100
    // Total minimum   = 40 / 100
    //
    // Both conditions must be satisfied.
    // ========================================

    if (
      external >= 35 &&
      total >= 40
    ) {

      result = "Pass";

    } else {

      result = "Fail";

    }

  }


  // ==========================================
  // DISPLAY VALUES
  // ==========================================

  setText(
    "facultyInternalReduced",
    internalReduced
  );


  setText(
    "facultyCIE",
    cie
  );


  setText(
    "facultyExternalReduced",
    external > 0
      ? externalReduced
      : "—"
  );


  setText(
    "facultyTotal",
    total !== null
      ? total
      : "—"
  );


  const resultElement =
    document.getElementById("facultyResult");

  if (resultElement) {

    resultElement.textContent = result;

    if (result === "Pass") {

      resultElement.style.color = "#22c55e";

    } else if (result === "Fail") {

      resultElement.style.color = "#ef4444";

    } else {

      resultElement.style.color = "#64748b";

    }
}


  // ==========================================
  // OTHER CALCULATION CARD IDS
  // ==========================================

  setText(
    "internalReduced",
    internalReduced
  );


  setText(
    "cieMarks",
    cie
  );


  setText(
    "externalReduced",
    external > 0
      ? externalReduced
      : "—"
  );


  setText(
    "totalMarks",
    total !== null
      ? total
      : "—"
  );


  setText(
    "resultStatus",
    result
  );


  // ==========================================
  // RETURN VALUES
  // ==========================================

  return {

    internal1:
      internal1,

    internal2:
      internal2,

    internalReduced:
      internalReduced,

    assignment:
      hasAssignment
        ? assignment
        : 0,

    report:
      hasReport
        ? report
        : 0,

    lab:
      hasLab
        ? lab
        : 0,

    cie:
      cie,

    external:
      external,

    externalReduced:
      external > 0
        ? externalReduced
        : 0,

    total:
      total !== null
        ? total
        : 0,

    result:
      result,

    hasAssignment:
      hasAssignment,

    hasReport:
      hasReport,

    hasLab:
      hasLab
  };

}

function saveFacultyMarks() {

  const rows =
    window.facultyMarksRows || [];

  const index =
    window.currentFacultyStudentIndex;

  const row =
    rows[index];


  if (!row) {

    alert(
      "Student information not found."
    );

    return;

  }


  const button =
    document.getElementById(
      "facultySaveButton"
    );


  if (!button) {

    alert(
      "Update Marks button not found."
    );

    return;

  }


  function getValue(id) {

    const element =
      document.getElementById(id);

    if (!element) {
      return "";
    }

    return String(
      element.value ?? ""
    ).trim();

  }


  function getNumber(id) {

    const text =
      getValue(id);

    if (text === "") {
      return 0;
    }

    const number =
      Number(text);

    return Number.isFinite(number)
      ? number
      : 0;

  }


  const assignmentElement =
    document.getElementById(
      "facultyAssignment"
    );

  const reportElement =
    document.getElementById(
      "facultyReport"
    );

  const labElement =
    document.getElementById(
      "facultyLab"
    );


  /*
   * IMPORTANT:
   *
   * External comes from Subject_Marks.
   * It is readonly in the form.
   *
   * Therefore we preserve exactly
   * what is currently displayed.
   */

  const externalText =
    getValue("facultyExternal");


  const marks = {

    usn:
      String(
        row.usn || ""
      ).trim(),

    semester:
      row.semester,

    subjectCode:
      String(
        row.subjectCode || ""
      ).trim(),

    subjectName:
      String(
        row.subjectName || ""
      ).trim(),

    section:
      String(
        row.section || ""
      ).trim(),


    internal1:
      getNumber(
        "facultyInternal1"
      ),

    internal2:
      getNumber(
        "facultyInternal2"
      ),

    assignment:
      getNumber(
        "facultyAssignment"
      ),

    report:
      getNumber(
        "facultyReport"
      ),

    lab:
      getNumber(
        "facultyLab"
      ),


    /*
     * Preserve existing External.
     */

    external:
      externalText === ""
        ? 0
        : Number(externalText),


    hasAssignment:
      !!assignmentElement &&
      !assignmentElement.disabled,

    hasReport:
      !!reportElement &&
      !reportElement.disabled,

    hasLab:
      !!labElement &&
      !labElement.disabled

  };


  /*
   * If External is empty, stop.
   *
   * We NEVER want an existing external
   * mark to accidentally become zero.
   */

  if (externalText === "") {
    marks.external = 0;
  }


  /*
   * Calculate before save.
   */

  const calculated =
    calculateFacultyMarks();


  console.log(
    "FACULTY MARKS TO SAVE:",
    marks
  );

  console.log(
    "FACULTY CALCULATION:",
    calculated
  );


  button.disabled =
    true;

  button.textContent =
    "Saving...";


  google.script.run

    .withSuccessHandler(
      function(response) {

        console.log(
          "FACULTY SAVE RESPONSE:",
          response
        );


        if (
          response &&
          response.success === true
        ) {

          /*
           * Update local row.
           */

          row.internal1 =
            marks.internal1;

          row.internal2 =
            marks.internal2;

          row.assignment =
            marks.assignment;

          row.report =
            marks.report;

          row.lab =
            marks.lab;

          row.external =
            marks.external;


          row.internalReduced =
            response.internalReduced;

          row.cie =
            response.cie;

          row.externalReduced =
            response.externalReduced;

          row.total =
            response.total;

          row.result =
            response.result;


        button.classList.add(
          "update-success"
        );

        button.disabled = true;

        button.textContent =
          "✓ Marks Updated Successfully";


        setTimeout(
          function() {

            button.classList.remove(
              "update-success"
            );

            button.disabled =
              false;

            button.textContent =
              "✓ Update Marks";

          },
          1000
        );


        } else {

          button.disabled =
            false;

          button.textContent =
            "✕ Save Failed";


          alert(
            "Marks were not saved.\n\n" +
            (
              response &&
              response.message
                ? response.message
                : "Unknown error."
            )
          );

        }

      }
    )

    .withFailureHandler(
      function(error) {

        console.error(
          "FACULTY SAVE ERROR:",
          error
        );


        button.disabled =
          false;

        button.textContent =
          "✕ Save Failed";


        alert(
          "Marks were not saved.\n\n" +
          (
            error &&
            error.message
              ? error.message
              : String(error)
          )
        );

      }
    )

    .saveFacultyMarksToSheet(
      marks
    );

}

function getCurrentFilterBuilderValues() {

  const values = {};

  getFilterBuilderFieldIds()
    .forEach(function(id) {

      const element =
        document.getElementById(id);

      if (element) {

        values[id] =
          element.value;

      }

    });

  return values;

}


function saveCurrentFilterPreset() {

  const nameElement =
    document.getElementById(
      'fbSavedFilterName'
    );

  if (!nameElement) return;


  const name =
    String(
      nameElement.value || ''
    ).trim();


  if (!name) {

    alert(
      'Please enter a name for the filter.'
    );

    nameElement.focus();

    return;

  }


  const saved =
    JSON.parse(
      localStorage.getItem(
        'sidssSavedFilterPresets'
      ) || '[]'
    );


  const existingIndex =
    saved.findIndex(
      function(item) {

        return item.name
          .toLowerCase()
          === name.toLowerCase();

      }
    );


  const preset = {

    name: name,

    values:
      getCurrentFilterBuilderValues(),

    savedAt:
      new Date().toISOString()

  };


  if (existingIndex >= 0) {

    saved[existingIndex] =
      preset;

  } else {

    saved.push(preset);

  }


  localStorage.setItem(
    'sidssSavedFilterPresets',
    JSON.stringify(saved)
  );


  nameElement.value = '';


  renderSavedFilterPresets();

}


function renderSavedFilterPresets() {

  const container =
    document.getElementById(
      'fbSavedFiltersList'
    );

  if (!container) return;


  const saved =
    JSON.parse(
      localStorage.getItem(
        'sidssSavedFilterPresets'
      ) || '[]'
    );


  if (!saved.length) {

    container.innerHTML = `

      <div class="fb-no-saved">

        No saved filters yet.

      </div>

    `;

    return;

  }


  container.innerHTML =
    saved.map(
      function(item, index) {

        return `

          <div
            class="fb-saved-item">

            <span
              class="fb-saved-item-name">

              ${escapeHtml(item.name)}

            </span>


            <div
              class="fb-saved-item-actions">

              <button
                type="button"
                class="fb-saved-load"
                onclick="loadFilterPreset(${index})">

                Load

              </button>


              <button
                type="button"
                class="fb-saved-delete"
                onclick="deleteFilterPreset(${index})">

                Delete

              </button>

            </div>

          </div>

        `;

      }
    )
    .join('');

}


function loadFilterPreset(index) {

  try {

    const saved =
      JSON.parse(
        localStorage.getItem(
          'sidssSavedFilterPresets'
        ) || '[]'
      );


    const preset =
      saved[index];


    if (!preset || !preset.values) {

      alert(
        'Saved filter not found.'
      );

      return;

    }


    const values =
      preset.values;


    let loadedCount = 0;


    Object.keys(values)
      .forEach(function(id) {

        const element =
          document.getElementById(id);


        if (!element) {

          console.warn(
            'Filter field not found:',
            id
          );

          return;

        }


        element.value =
          values[id] === null ||
          values[id] === undefined
            ? ''
            : String(values[id]);


        element.dispatchEvent(
          new Event(
            'input',
            {
              bubbles: true
            }
          )
        );


        element.dispatchEvent(
          new Event(
            'change',
            {
              bubbles: true
            }
          )
        );


        loadedCount++;

      });


    /*
     * Update the Filter Builder summary
     * only if your project has this function.
     */

    if (
      typeof updateFilterBuilderSummary ===
      'function'
    ) {

      updateFilterBuilderSummary();

    }


    /*
     * Scroll to the first restored field.
     */

    const firstFieldId =
      Object.keys(values)
        .find(function(id) {

          const element =
            document.getElementById(id);

          return (
            element &&
            String(values[id] || '').trim() !== ''
          );

        });


    if (firstFieldId) {

      const firstField =
        document.getElementById(
          firstFieldId
        );


      if (firstField) {

        firstField.scrollIntoView({

          behavior: 'smooth',

          block: 'center'

        });

      }

    }


    /*
     * Simple confirmation.
     * No external helper function.
     */

    console.log(
      'Saved filter loaded:',
      preset.name,
      'Fields loaded:',
      loadedCount
    );


  } catch (error) {

    console.error(
      'Load Saved Filter error:',
      error
    );


    alert(
      'Unable to load the saved filter.\n\n' +
      error.message
    );

  }

}


function deleteFilterPreset(index) {

  const saved =
    JSON.parse(
      localStorage.getItem(
        'sidssSavedFilterPresets'
      ) || '[]'
    );


  if (!saved[index]) return;


  saved.splice(
    index,
    1
  );


  localStorage.setItem(
    'sidssSavedFilterPresets',
    JSON.stringify(saved)
  );


  renderSavedFilterPresets();

}



function closeFilterBuilder() {

  const overlay =
    document.getElementById(
      'filterBuilderOverlay'

  if (overlay) {
    overlay.remove();
  }

}


function clearFilterBuilder() {

  const overlay =
    document.getElementById(
      'filterBuilderOverlay'
    );

  if (!overlay) return;

  overlay
    .querySelectorAll('input, select')
    .forEach(function(element) {

      element.value = '';

    });

}


function applyFilterBuilder() {

  const button =
    document.querySelector(
      '.filter-apply-button'
    );

  if (button) {
    button.disabled = true;
    button.textContent = 'Filtering...';
  }


  google.script.run

    .withSuccessHandler(function(records) {

      try {

        const filtered =
          filterBuilderRecords(records || []);


        window.sidssFilterBuilderRecords =
          records || [];

        window.sidssFilteredStudents =
          filtered;


        closeFilterBuilder();


        showFilterBuilderResults(
          filtered
        );


      } catch (error) {

        console.error(
          'Filter Builder error:',
          error
        );

        alert(
          'Unable to apply filter.\n\n' +
          error.message
        );

      }

    })

    .withFailureHandler(function(error) {

      console.error(
        'Filter Builder server error:',
        error
      );

      if (button) {

        button.disabled = false;
        button.textContent = 'Apply Filter';

      }

      alert(
        'Unable to load student data.\n\n' +
        (
          error && error.message
            ? error.message
            : String(error)
        )
      );

    })

    .getFilterBuilderStudents(
      currentUser
    );

}



function showFilterBuilderResults(records) {

  records =
    Array.isArray(records)
      ? records
      : [];


  // =====================================================
  // KEEP ORIGINAL STUDENT DATA
  // =====================================================

  if (
    !window.sidssOriginalStudents
  ) {

    window.sidssOriginalStudents =
      window.sidssStudents || [];

  }


  // =====================================================
  // CONVERT FILTER RESULTS
  // =====================================================

  const studentRecords =
    records.map(function(record) {

      const recordUSN =
        record.usn ||
        record.USN ||
        record.Student_ID ||
        record.Student_Id ||
        '';


      /*
      * Filter Builder records do not always carry
      * the student's email.
      *
      * So first try the filter record.
      * If it is missing, find the same student
      * in the original Students data using USN.
      */

      let email =
        record.email ||
        record.Email ||
        record.studentEmail ||
        record.Student_Email ||
        record.emailAddress ||
        record.Email_Address ||
        '';


      if (!email && window.sidssOriginalStudents) {

        const originalStudent =
          window.sidssOriginalStudents.find(
            function(student) {

              const originalUSN =
                getStudentField(
                  student,
                  [
                    'USN',
                    'Student_ID',
                    'Student_Id'
                  ]
                );


              return String(
                originalUSN || ''
              )
                .trim()
                .toLowerCase()
                ===
                String(
                  recordUSN || ''
                )
                  .trim()
                  .toLowerCase();

            }
          );


        if (originalStudent) {

          email =
            getStudentField(
              originalStudent,
              [
                'Email',
                'Student_Email',
                'StudentEmail',
                'Email_Address',
                'email'
              ]
            ) || '';

        }

      }


      return {

        USN:
          recordUSN,

        Student_Name:
          record.studentName ||
          record.Student_Name ||
          record.Name ||
          record.Full_Name ||
          '',

        Department:
          record.department ||
          record.Department ||
          record.Dept ||
          '',

        Semester:
          record.semester ||
          record.Semester ||
          record.Sem ||
          record.Current_Semester ||
          '',

        Branch:
          record.branch ||
          record.Branch ||
          '',

        Batch:
          record.batch ||
          record.Batch ||
          '',

        Section:
          record.section ||
          record.Section ||
          '',

        Email:
          email,

        Status:
          record.status ||
          record.Status ||
          'Active'

      };

    });


  // =====================================================
  // STORE FILTERED DATA
  // =====================================================

  window.sidssFilterBuilderRecords =
    records;

  window.sidssFilteredStudents =
    studentRecords;


  // =====================================================
  // DISPLAY FILTERED STUDENTS
  // =====================================================

  window.sidssStudents =
    studentRecords;


  displayStudents(
    studentRecords
  );


  // =====================================================
  // UPDATE COUNT
  // =====================================================

  const count =
    document.getElementById(
      'visibleStudentCount'
    );


  if (count) {

    count.textContent =
      studentRecords.length +
      ' filtered records';

  }


  // =====================================================
  // FIND STUDENT TABLE
  // =====================================================

  const tableBody =
    document.getElementById(
      'studentsTableBody'
    );


  if (!tableBody) {

    console.error(
      'Filter Builder: studentsTableBody not found.'
    );

    return;

  }


  const table =
    tableBody.closest('table');

    console.error(

    return;

  }


  // =====================================================
  // FIND TABLE CONTAINER

  // =====================================================

function downloadFilteredStudentsCSV() {

  const records =
    Array.isArray(
      window.sidssFilteredStudents
    )
      ? window.sidssFilteredStudents
      : [];


  if (!records.length) {

    alert(
      'There are no filtered students to download.'
    );

    return;

  }


  const headers = [

    'Student Name',
    'USN',
    'Department',
    'Semester',
    'Branch',
    'Batch',
    'Section',
    'Email',
    'Status'

  ];


  function csvValue(value) {

    const text =
      String(
        value === null ||
        value === undefined
          ? ''
          : value
      );


    return '"' +
      text
        .replace(/"/g, '""') +
      '"';

  }


  const rows = [

    headers.map(csvValue).join(',')

  ];


  records.forEach(
    function(record) {

      rows.push(

        [

          record.Student_Name ||
            record.studentName ||
            '',

          record.USN ||
            record.usn ||
            '',

          record.Department ||
            record.department ||
            '',

          record.Semester ||
            record.semester ||
            '',

          record.Branch ||
            record.branch ||
            '',

          record.Batch ||
            record.batch ||
            '',

          record.Section ||
            record.section ||
            '',

          record.Email ||
            record.email ||
            '',

          record.Status ||
            record.status ||
            'Active'

        ]
          .map(csvValue)
          .join(',')

      );

    }
  );


  /*
   * UTF-8 BOM makes the CSV open correctly
   * in Microsoft Excel.
   */

  const csv =
    '\uFEFF' +
    rows.join('\r\n');


  const blob =
    new Blob(
      [csv],
      {
        type:
          'text/csv;charset=utf-8;'
      }
    );


  const url =
    URL.createObjectURL(blob);


  const link =
    document.createElement('a');


  link.href =
    url;


  const date =
    new Date()
      .toISOString()
      .slice(0,10);


  link.download =
    'SIDSS_Filtered_Students_' +
    date +
    '.csv';


  document.body.appendChild(
    link
  );


  link.click();


  link.remove();


  URL.revokeObjectURL(
    url
  );

}

    window.sidssOriginalStudents || [];

  const count =
    document.getElementById(
      'visibleStudentCount'

    document.getElementById(
      'filterBuilderActiveStatus'
    );

  }

    null;

function filterBuilderRecords(records) {

  // =====================================================
  // SAFETY
  // =====================================================

  if (!Array.isArray(records)) {
    return [];
  }


  // =====================================================
  // GET VALUE
  // =====================================================

  function value(id) {

    const element =
      document.getElementById(id);

    if (!element) {
      return '';
    }

    return String(
      element.value || ''
    ).trim();

  }


  // =====================================================
  // GET NUMBER
  // =====================================================

  function numberValue(id) {

    const raw =
      value(id);

    if (raw === '') {
      return null;
    }

    const number =
      Number(raw);

    return Number.isFinite(number)
      ? number
      : null;

  }


  // =====================================================
  // TEXT MATCH
  // =====================================================

  function textMatches(actual, wanted) {

    if (!wanted) {
      return true;
    }

    return String(actual || '')
      .trim()
      .toLowerCase()
      .includes(
        String(wanted)
          .trim()
          .toLowerCase()
      );

  }


  // =====================================================
  // ACADEMIC
  // =====================================================

  const minCGPA =
    numberValue('fbMinCGPA');

  const maxCGPA =
    numberValue('fbMaxCGPA');

  const minSGPA =
    numberValue('fbMinSGPA');

  const maxSGPA =
    numberValue('fbMaxSGPA');

  const minBacklogs =
    numberValue('fbMinBacklogs');

  const maxBacklogs =
    numberValue('fbMaxBacklogs');

  const minClassRank =
    numberValue('fbMinClassRank');

  const maxClassRank =
    numberValue('fbMaxClassRank');

  const minBranchRank =
    numberValue('fbMinBranchRank');

  const maxBranchRank =
    numberValue('fbMaxBranchRank');


  // =====================================================
  // ATTENDANCE
  // =====================================================

  const minAttendance =
    numberValue('fbMinAttendance');

  const maxAttendance =
    numberValue('fbMaxAttendance');

  const defaulter =
    value('fbDefaulterStatus')
      .toLowerCase();

  const attendanceTrend =
    value('fbAttendanceTrend')
      .toLowerCase();


  // =====================================================
  // PLACEMENT
  // =====================================================

  const eligibility =
    value('fbEligibility')
      .toLowerCase();

  const offerStatus =
    value('fbOfferStatus')
      .toLowerCase();

  const minPackage =
    numberValue('fbMinPackage');

  const maxPackage =
    numberValue('fbMaxPackage');


  // =====================================================
  // SKILLS / TRAINING
  // =====================================================

  const certification =
    value('fbCertification');

  const skill =
    value('fbSkill');

  const proficiency =
    value('fbSkillProficiency')
      .toLowerCase();

  const hackathon =
    value('fbHackathon')
      .toLowerCase();


  // =====================================================
  // ADMINISTRATIVE
  // =====================================================

  const department =
    value('fbDepartment');

  const branch =
    value('fbBranch');

  const batch =
    value('fbBatch');

  const section =
    value('fbSection');


  // =====================================================
  // IMPORTANT:
  // IF NOTHING IS SELECTED, RETURN ALL RECORDS
  // =====================================================

  const noFiltersSelected =

    minCGPA === null &&
    maxCGPA === null &&

    minSGPA === null &&
    maxSGPA === null &&

    minBacklogs === null &&
    maxBacklogs === null &&

    minClassRank === null &&
    maxClassRank === null &&

    minBranchRank === null &&
    maxBranchRank === null &&

    minAttendance === null &&
    maxAttendance === null &&

    !defaulter &&
    !attendanceTrend &&

    !eligibility &&
    !offerStatus &&

    minPackage === null &&
    maxPackage === null &&

    !certification &&
    !skill &&
    !proficiency &&
    !hackathon &&

    !department &&
    !branch &&
    !batch &&
    !section;


  if (noFiltersSelected) {

    console.log(
      'Filter Builder: No filters selected. Returning all records:',
      records.length
    );

    return records;

  }


  // =====================================================
  // APPLY FILTERS
  // ALL CONDITIONS USE AND LOGIC
  // =====================================================

  return records.filter(function(student) {


    // ===================================================
    // ACADEMIC
    // ===================================================

    const cgpa =
      Number(student.cgpa);

    const sgpa =
      Number(student.sgpa);

    const backlogs =
      Number(student.backlogs);

    const classRank =
      Number(student.classRank);

    const branchRank =
      Number(student.branchRank);


    if (
      minCGPA !== null &&
      (
        !Number.isFinite(cgpa) ||
        cgpa < minCGPA
      )
    ) {
      return false;
    }


    if (
      maxCGPA !== null &&
      (
        !Number.isFinite(cgpa) ||
        cgpa > maxCGPA
      )
    ) {
      return false;
    }


    if (
      minSGPA !== null &&
      (
        !Number.isFinite(sgpa) ||
        sgpa < minSGPA
      )
    ) {
      return false;
    }


    if (
      maxSGPA !== null &&
      (
        !Number.isFinite(sgpa) ||
        sgpa > maxSGPA
      )
    ) {
      return false;
    }


    if (
      minBacklogs !== null &&
      (
        !Number.isFinite(backlogs) ||
        backlogs < minBacklogs
      )
    ) {
      return false;
    }


    if (
      maxBacklogs !== null &&
      (
        !Number.isFinite(backlogs) ||
        backlogs > maxBacklogs
      )
    ) {
      return false;
    }


    if (
      minClassRank !== null &&
      (
        !Number.isFinite(classRank) ||
        classRank < minClassRank
      )
    ) {
      return false;
    }


    if (
      maxClassRank !== null &&
      (
        !Number.isFinite(classRank) ||
        classRank > maxClassRank
      )
    ) {
      return false;
    }


    if (
      minBranchRank !== null &&
      (
        !Number.isFinite(branchRank) ||
        branchRank < minBranchRank
      )
    ) {
      return false;
    }


    if (
      maxBranchRank !== null &&
      (
        !Number.isFinite(branchRank) ||
        branchRank > maxBranchRank
      )
    ) {
      return false;
    }


    // ===================================================
    // ATTENDANCE
    // ===================================================

    const attendance =
      Number(
        student.overallAttendance
      );


    if (
      minAttendance !== null &&
      (
        !Number.isFinite(attendance) ||
        attendance < minAttendance
      )
    ) {
      return false;
    }


    if (
      maxAttendance !== null &&
      (
        !Number.isFinite(attendance) ||
        attendance > maxAttendance
      )
    ) {
      return false;
    }


    if (defaulter) {

      const actualDefaulter =
        String(
          student.defaulterStatus || ''
        )
          .trim()
          .toLowerCase();


      if (
        actualDefaulter !== defaulter
      ) {
        return false;
      }

    }


    if (attendanceTrend) {

      const actualTrend =
        String(
          student.attendanceTrend || ''
        )
          .trim()
          .toLowerCase();


      if (
        actualTrend !== attendanceTrend
      ) {
        return false;
      }

    }


    // ===================================================
    // PLACEMENT
    // ===================================================

    if (
      eligibility &&
      !textMatches(
        student.eligibility,
        eligibility
      )
    ) {
      return false;
    }


    if (
      offerStatus &&
      !textMatches(
        student.offerStatus,
        offerStatus
      )
    ) {
      return false;
    }


    const packageLPA =
      Number(
        student.packageLPA
      );


    if (
      minPackage !== null &&
      (
        !Number.isFinite(packageLPA) ||
        packageLPA < minPackage
      )
    ) {
      return false;
    }


    if (
      maxPackage !== null &&
      (
        !Number.isFinite(packageLPA) ||
        packageLPA > maxPackage
      )
    ) {
      return false;
    }


    // ===================================================
    // SKILL
    // ===================================================

    if (skill) {

      const skills =
        Array.isArray(student.skills)
          ? student.skills
          : [];


      const hasSkill =
        skills.some(function(item) {

          return textMatches(
            item &&
              item.skill,
            skill
          );

        });


      if (!hasSkill) {
        return false;
      }

    }


    // ===================================================
    // SKILL PROFICIENCY
    // ===================================================

    if (proficiency) {

      const skills =
        Array.isArray(student.skills)
          ? student.skills
          : [];


      const hasProficiency =
        skills.some(function(item) {

          return String(
            item &&
            item.proficiency
              ? item.proficiency
              : ''
          )
            .trim()
            .toLowerCase()
            === proficiency;

        });


      if (!hasProficiency) {
        return false;
      }

    }


    // ===================================================
    // CERTIFICATION
    // ===================================================

    if (certification) {

      const certifications =
        Array.isArray(
          student.certifications
        )
          ? student.certifications
          : [];


      const hasCertification =
        certifications.some(
          function(item) {

            return (
              textMatches(
                item &&
                  item.title,
                certification
              ) ||

              textMatches(
                item &&
                  item.provider,
                certification
              )
            );

          }
        );


      if (!hasCertification) {
        return false;
      }

    }


    // ===================================================
    // HACKATHON
    // ===================================================

    if (hackathon) {

      const participated =
        Boolean(
          student.hackathonParticipation
        );


      if (
        hackathon === 'yes' &&
        !participated
      ) {
        return false;
      }


      if (
        hackathon === 'no' &&
        participated
      ) {
        return false;
      }

    }


    // ===================================================
    // ADMINISTRATIVE
    // ===================================================

    if (
      department &&
      !textMatches(
        student.department,
        department
      )
    ) {
      return false;
    }


    if (
      branch &&
      !textMatches(
        student.branch,
        branch
      )
    ) {
      return false;
    }


    if (
      batch &&
      !textMatches(
        student.batch,
        batch
      )
    ) {
      return false;
    }


    if (
      section &&
      !textMatches(
        student.section,
        section
      )
    ) {
      return false;
    }


    // ===================================================
    // STUDENT PASSES ALL SELECTED CONDITIONS
    // ===================================================

    return true;

  });

}

function openAtRiskStudents() {

  google.script.run

    .withSuccessHandler(function(records) {

      const atRiskStudents =
        Array.isArray(records)
          ? records
          : [];


      window.sidssAtRiskStudents =
        atRiskStudents;


      // Navigate first
      navigateToPage('students');


      let attempts = 0;


      const timer =
        setInterval(function() {

          attempts++;


          const table =
            document.getElementById(
              'studentsTableBody'
            );


          if (!table) {

            if (attempts >= 30) {

              clearInterval(timer);

            }

            return;

          }


          // Replace normal students
          // AFTER Students module has loaded.
          window.sidssStudents =
            atRiskStudents;


          window.sidssFilteredStudents =
            atRiskStudents;


          displayStudents(
            atRiskStudents
          );


          const count =
            document.getElementById(
              'visibleStudentCount'
            );


          if (count) {

            count.textContent =
              atRiskStudents.length +
              ' at-risk students';

          }


          clearInterval(timer);


          console.log(
            'At-Risk Students:',
            atRiskStudents.length
          );

        }, 300);

    })

    .withFailureHandler(function(error) {

      console.error(
        'At-Risk Students Error:',
        error
      );


      alert(
        'Unable to load At-Risk Students.\n\n' +
        (
          error &&
          error.message
            ? error.message
            : String(error)
        )
      );

    })

    .getAtRiskStudents(
      currentUser
    );

}
