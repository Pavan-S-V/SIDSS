<script>

let currentUser = null;

let studentProfileReturnModule = 'Students';

let currentPermissions = {};


function isDepartmentAdmin() {
  return (
    currentUser &&
    currentUser.role === 'Department Admin'
  );
}


function canEditData() {
  return (
    currentUser &&
    (
      currentUser.role === 'Department Admin' ||
      currentUser.role === 'Institution Admin'
    )
  );
}


function getCurrentDepartment() {
  if (!currentUser) {
    return '';
  }

  return String(
    currentUser.department || ''
  ).trim().toUpperCase();
}


/* ================= LOGIN ================= */

document.addEventListener(
  'DOMContentLoaded',
  function () {

    const form =
      document.getElementById('loginForm');

    if (form) {

      form.addEventListener(
        'submit',
        handleLogin
      );

    }


    // ============================================
    // RESTORE SAVED LOGIN SESSION
    // ============================================

    const savedUser =
      localStorage.getItem('sidssUser');


    if (!savedUser) {
      return;
    }


    try {

      const user =
        JSON.parse(savedUser);


      if (
        !user ||
        !user.role ||
        !user.email
      ) {

        localStorage.removeItem(
          'sidssUser'
        );

        return;

      }


      // Restore current user
      currentUser =
        user;


      // Faculty-specific sidebar
      if (
        currentUser.role === 'Faculty' &&
        typeof setupFacultySidebar === 'function'
      ) {

        setupFacultySidebar();

      }


      // Open dashboard directly
      openApplication();


    } catch (error) {

      console.error(
        'Session restore failed:',
        error
      );


      localStorage.removeItem(
        'sidssUser'
      );

    }

  }
);

function handleLogin(event) {

  event.preventDefault();


  const email =
    document
      .getElementById('email')
      .value
      .trim();


  const password =
    document
      .getElementById('password')
      .value;


  const button =
    document.getElementById('loginButton');


  const buttonText =
    document.getElementById('loginButtonText');


  const message =
    document.getElementById('loginMessage');


  message.innerHTML = '';

  button.disabled = true;

  buttonText.innerHTML =
    'Signing in...';


  google.script.run

    .withSuccessHandler(
      function (result) {

        button.disabled = false;

        buttonText.innerHTML =
          'Sign In';


        if (!result.success) {

          message.className =
            'error-message';

          message.innerHTML =
            result.message;

          return;
        }


        currentUser = result.user;

        // Save the logged-in user for the next time
        // the web app is opened.
        localStorage.setItem(
          'sidssUser',
          JSON.stringify(currentUser)
        );

        if (currentUser.role === 'Faculty') {

          setupFacultySidebar();

        }

        message.className =
          'success-message';

        message.innerHTML =
          'Login successful';


        setTimeout(
          function () {

            openApplication();

          },
          400
        );

      }
    )


    .withFailureHandler(
      function (error) {

        button.disabled = false;

        buttonText.innerHTML =
          'Sign In';

        message.className =
          'error-message';

        message.innerHTML =
          error.message;

      }
    )


    .loginUser(
      email,
      password
    );

}


/* ================= APPLICATION ================= */


function openApplication() {

  document
    .getElementById('loginPage')
    .classList.add('hidden');

  document
    .getElementById('appPage')
    .classList.remove('hidden');

  configureUserInterface();

  setupNavigation();

  applyRoleBasedNavigation();

  if (currentUser.role === 'Faculty') {

    setupFacultySidebar();

    loadFacultyDashboard();

  } else {

    loadDashboard();

  }

}

/* =====================================================
   USER INTERFACE
===================================================== */

function configureUserInterface() {

  const initial =
    currentUser.name
      ? currentUser.name.charAt(0).toUpperCase()
      : 'U';


  document.getElementById('sidebarName').textContent =
    currentUser.name;

  document.getElementById('sidebarRole').textContent =
    currentUser.role +
    (
      currentUser.department !== 'ALL'
        ? ' • ' + currentUser.department
        : ''
    );


  document.getElementById('topUserName').textContent =
    currentUser.name;

  document.getElementById('topUserRole').textContent =
    currentUser.role;


  document.getElementById('sidebarAvatar').textContent =
    initial;

  document.getElementById('topAvatar').textContent =
    initial;


  if (currentUser.role === 'Institution Admin') {

    document
      .getElementById('usersMenu')
      .classList.remove('hidden');

    document
      .getElementById('auditMenu')
      .classList.remove('hidden');

  }

}


/* =====================================================

===================================================== */

function loadDashboard() {

  document.getElementById('currentPageLabel').textContent =
    'Dashboard';


  document.getElementById('mainContent').innerHTML = `

    <div class="dashboard-loading">

      <div class="loader"></div>

      <p>
        Loading ${escapeHtml(currentUser.role)} dashboard...
      </p>

    </div>

  `;


  google.script.run

    .withSuccessHandler(function(result) {

      if (!result.success) {

        showPageError(result.message);

        return;

      }


      renderDashboard(result);

    })


    .withFailureHandler(function(error) {

      showPageError(error.message);

    })


    .getDashboardData(currentUser);

}

function openFacultyDashboardDetails(type) {

  let title = "Details";

  if (type === "students") {
    title = "All Assigned Students";
  }

  if (type === "subjects") {
    title = "Assigned Subjects";
  }

  if (type === "updated") {
    title = "Marks Updated";
  }

  if (type === "pending") {
    title = "Marks Pending";
  }

  if (type === "pass") {
    title = "Passed Students";
  }

  if (type === "fail") {
    title = "Failed Students";
  }


  const overlay = document.createElement("div");

  overlay.className = "fd-popup-overlay";

  overlay.id = "facultyDashboardPopup";


  overlay.innerHTML = `

    <div class="fd-popup">

      <div class="fd-popup-header">

        <div>

          <span class="fd-label">
            FACULTY WORKSPACE
          </span>

          <h3>
            ${title}
          </h3>

        </div>

        <button
          class="fd-popup-close"
          onclick="closeFacultyDashboardDetails()">

          ×

        </button>

      </div>


      <div
        class="fd-popup-body"
        id="fdPopupBody">

        <div class="fd-popup-empty">

          Loading details...

        </div>

      </div>

    </div>

  `;


  document.body.appendChild(overlay);


  google.script.run

    .withSuccessHandler(function(data) {

      renderFacultyDashboardDetails(data, type);

    })

    .withFailureHandler(function(error) {

      document.getElementById("fdPopupBody").innerHTML = `

        <div class="fd-popup-empty">

          Unable to load details.<br><br>

          ${error.message}

        </div>

      `;

    })

    .getFacultyDashboardDetails(
      currentUser.facultyId,
      type
    );

}

function setupNavigation() {

  document
    .querySelectorAll('.nav-item')
    .forEach(function(button) {

      button.addEventListener('click', function() {

        const page =
          this.dataset.page;


        document
          .querySelectorAll('.nav-item')
          .forEach(function(item) {

            item.classList.remove('active');

          });


        this.classList.add('active');

        if (page === 'dashboard') {

          if (currentUser.role === 'Faculty') {

            loadFacultyDashboard();

          } else {

            loadDashboard();

          }

        }

        else if (page === 'students') {

          loadStudents();

        }

        else if (page === 'academics') {

          loadAcademics();

        }

        else if (page === 'attendance') {

          loadAttendance();

        }

        else if (page === 'placement') {

          loadPlacement();

        }

        else if (page === 'skills') {

          loadSkills();

        }

        else if (
          page === 'training' ||
          page === 'training_certifications'
        ) {

          loadTraining();

        }

        else if (page === 'reports') {

          loadReports();

        }

        else if (page === 'events') {

          loadEvents();

        }

        else if (
          page === 'audit' ||
          page === 'audit_logs'
        ) {

          loadAuditLogs();

        }

        else if (
          page === 'users' ||
          page === 'user_management'
        ) {

          loadUserManagement();

        }

        else if (
          page === 'audit' ||
          page === 'audit_logs'
        ) {

          loadAuditLogs();

        }

        else if (page === 'marks_entry') {

          loadFacultyMarksEntry();

        }

        else if (page === 'profile') {

          loadFacultyProfile();

        }

        else {

          loadComingSoonPage(page);

        }

      });

    });

}

function displayAuditLogs(records) {

  const body =
    document.getElementById(

    );


  if (!body) {
    return;
  }


  if (!records.length) {

    body.innerHTML = `

      <tr>

        <td
          colspan="10"
          class="empty-table"
        >
          No audit logs found.
        </td>

      </tr>

    `;


    const count =
      document.getElementById(
        'auditRecordCount'
      );


    if (count) {
      count.textContent = '0 logs';
    }


    return;

  }


  body.innerHTML =
    records
      .map(function(record) {

        const status =
          String(record.status || '')
            .trim()
            .toLowerCase();


        const success =
          status === 'success';


        return `

          <tr>

            <!-- LOG ID -->

            <td class="usn-cell">

              ${escapeHtml(
                record.logId || '-'
              )}

            </td>


            <!-- TIMESTAMP -->

            <td>

              ${escapeHtml(
                record.timestamp || '-'
              )}

            </td>


            <!-- USER EMAIL -->

            <td>

              <strong>

                ${escapeHtml(
                  record.userEmail || '-'
                )}

              </strong>

            </td>


            <!-- ROLE -->

            <td>

              ${escapeHtml(
                record.userRole || '-'
              )}

            </td>


            <!-- ACTION -->

            <td>

              <span class="interview-status">

                ${escapeHtml(
                  record.action || '-'
                )}

              </span>

            </td>


            <!-- MODULE -->

            <td>

              ${escapeHtml(
                record.module || '-'
              )}

            </td>


            <!-- RECORD ID -->

            <td class="usn-cell">

              ${escapeHtml(
                record.recordId || '-'
              )}

            </td>


            <!-- DESCRIPTION -->

            <td>

              ${escapeHtml(
                record.description || '-'
              )}

            </td>


            <!-- IP / SOURCE -->

            <td>

              ${escapeHtml(
                record.ipAddress || '-'
              )}

            </td>


            <!-- STATUS -->

            <td>

              <span class="${
                success
                  ? 'placement-yes'
                  : 'placement-no'
              }">

                ${
                  success
                    ? '● Success'
                    : '● ' +
                      escapeHtml(
                        record.status ||
                        'Failed'
                      )
                }

              </span>

            </td>

          </tr>

        `;

      })
      .join('');


  const count =
    document.getElementById(
      'auditRecordCount'
    );


  if (count) {

    count.textContent =
      records.length +
      ' logs';

  }

}

function filterAuditLogs() {

  const searchInput =
    document.getElementById(
      'auditSearch'
    );


  const actionFilter =
    document.getElementById(
      'auditActionFilter'
    );


  const statusFilter =
    document.getElementById(
      'auditStatusFilter'
    );


  const search =
    searchInput
      ? searchInput.value
          .trim()
          .toLowerCase()
      : '';


  const action =
    actionFilter
      ? actionFilter.value
          .trim()
          .toLowerCase()
      : '';


  const status =
    statusFilter
      ? statusFilter.value
          .trim()
          .toLowerCase()
      : '';


  const records =
    window.sidssAuditRecords || [];


  const filtered =
    records.filter(function(record) {

      const searchableText = [

        record.logId,
        record.timestamp,
        record.userEmail,
        record.userRole,
        record.action,
        record.module,
        record.recordId,
        record.description,
        record.ipAddress,
        record.status

      ]
        .join(' ')
        .toLowerCase();


      const matchesSearch =
        !search ||
        searchableText.includes(search);


      const matchesAction =
        !action ||
        String(record.action || '')
          .trim()
          .toLowerCase() === action;


      const matchesStatus =
        !status ||
        String(record.status || '')
          .trim()
          .toLowerCase() === status;


      return (
        matchesSearch &&
        matchesAction &&
        matchesStatus
      );

    });


  displayAuditLogs(
    filtered
  );

}

function displayUserManagementRecords(records) {

  const body =
    document.getElementById(
      'userManagementTableBody'
    );


  if (!body) {
    return;
  }


  if (!records.length) {

    body.innerHTML = `

      <tr>

        <td
          colspan="7"
          class="empty-table"
        >
          No users found.
        </td>

      </tr>

    `;

    return;

  }


  body.innerHTML =
    records.map(function(record) {

      const initial =
        record.fullName
          ? record.fullName
              .charAt(0)
              .toUpperCase()
          : 'U';


      const active =
        String(record.status || '')
          .trim()
          .toLowerCase() === 'active';


      return `

        <tr>

          <!-- USER -->

          <td>

            <div class="student-name-cell">

              <div class="student-avatar">

                ${escapeHtml(initial)}

              </div>


              <div>

                <strong>

                  ${escapeHtml(
                    record.fullName ||
                    'User'
                  )}

                </strong>

                <span>

                  ${escapeHtml(
                    record.role || ''
                  )}

                </span>

              </div>

            </div>

          </td>


          <!-- USER ID -->

          <td class="usn-cell">

            ${escapeHtml(
              record.userId || '-'
            )}

          </td>


          <!-- EMAIL -->

          <td>

            ${escapeHtml(
              record.email || '-'
            )}

          </td>


          <!-- ROLE -->

          <td>

            ${escapeHtml(
              record.role || '-'
            )}

          </td>


          <!-- DEPARTMENT -->

          <td>

            ${escapeHtml(
              record.department || '-'
            )}

          </td>


          <!-- STATUS -->

          <td>

            <span class="${
              active
                ? 'placement-yes'
                : 'placement-no'
            }">

              ${
                active
                  ? '● Active'
                  : '● ' +
                    escapeHtml(
                      record.status ||
                      'Inactive'
                    )
              }

            </span>

          </td>


          <!-- ACTION -->

          <td>

            <button
              type="button"
              class="placement-edit-button"
              onclick="openEditUserModal(
                '${escapeHtml(record.userId)}'
              )"
            >
              Edit
            </button>

          </td>

        </tr>

      `;

    }).join('');


  const count =
    document.getElementById(
      'userManagementRecordCount'
    );


  if (count) {

    count.textContent =
      records.length +
      ' users';

  }

}


/* =====================================================
   USER SEARCH
===================================================== */

function filterUserManagement() {

  const searchInput =
    document.getElementById(
      'userManagementSearch'
    );

  const roleFilter =
    document.getElementById(
      'userRoleFilter'
    );

  const departmentFilter =
    document.getElementById(
      'userDepartmentFilter'
    );

  const statusFilter =
    document.getElementById(
      'userStatusFilter'
    );


  const search =
    searchInput
      ? searchInput.value
          .trim()
          .toLowerCase()
      : '';


  const role =
    roleFilter
      ? roleFilter.value
          .trim()
          .toLowerCase()
      : '';


  const department =
    departmentFilter
      ? departmentFilter.value
          .trim()
          .toLowerCase()
      : '';


  const status =
    statusFilter
      ? statusFilter.value
          .trim()
          .toLowerCase()
      : '';


  const records =
    window.sidssUserRecords || [];


  const filtered =
    records.filter(function(record) {

      const text = [

        record.userId,
        record.fullName,
        record.email,
        record.role,
        record.department,
        record.status

      ]
        .join(' ')
        .toLowerCase();


      const matchesSearch =
        !search ||
        text.includes(search);


      const matchesRole =
        !role ||
        String(record.role || '')
          .trim()
          .toLowerCase() === role;


      const matchesDepartment =
        !department ||
        String(record.department || '')
          .trim()
          .toLowerCase() === department;


      const matchesStatus =
        !status ||
        String(record.status || '')
          .trim()
          .toLowerCase() === status;


      return (
        matchesSearch &&
        matchesRole &&
        matchesDepartment &&
        matchesStatus
      );

  });


  displayUserManagementRecords(
    filtered
  );

}

function getUserRoleCount(records) {

  const roles = {};


  (records || [])
    .forEach(function(record) {

      const role =
        String(record.role || '')
          .trim()
          .toLowerCase();


      if (role) {
        roles[role] = true;
      }

    });


  return Object.keys(roles).length;

}


function getScopeLabel(scope) {

  const role =
    String(
      currentUser &&
      currentUser.role
        ? currentUser.role
        : ''
    )
      .trim()
      .toLowerCase();


  if (role === 'principal') {
    return 'Principal';
  }


  if (role === 'placement officer') {
    return 'Placement Cell';
  }


  return scope || 'Institution';

}

  const appPage = document.getElementById('appPage');

  if (appPage) {
    appPage.classList.add('hidden');
  }

  // Show login page
  const loginPage = document.getElementById('loginPage');

  if (loginPage) {
    loginPage.classList.remove('hidden');
  }

  // Clear login fields
  const email = document.getElementById('email');
  const password = document.getElementById('password');
  const message = document.getElementById('loginMessage');

  if (email) email.value = '';
  if (password) password.value = '';
  if (message) message.innerHTML = '';

  // Reset sidebar if it was collapsed

function escapeHtml(value) {

  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}

function renderDashboardCharts(charts) {

  charts =
    charts || {};


  /*
   * Prevent duplicate Chart.js instances
   * when Dashboard is opened repeatedly.
   */

  if (
    typeof Chart === 'undefined'
  ) {

    const script =
      document.createElement(
        'script'
      );


    script.src =
      'https://cdn.jsdelivr.net/npm/chart.js';


    script.onload =
      function() {

        renderDashboardCharts(
          charts
        );

      };


    document.head.appendChild(
      script
    );


    return;

  }


  /*
   * Destroy old charts if Dashboard
   * is opened again.
   */

  if (
    window.sidssDashboardCharts
  ) {

    Object.keys(
      window.sidssDashboardCharts
    )
      .forEach(function(key) {

        try {

          window.sidssDashboardCharts[
            key
          ].destroy();

        } catch (e) {}

      });

  }


  window.sidssDashboardCharts =
    {};


  // ==================================================
  // 1. PLACEMENT BY DEPARTMENT
  // ==================================================

  const placementCanvas =
    document.getElementById(
      'placementDepartmentChart'
    );


  if (placementCanvas) {

    const data =
      charts.placementByDepartment ||
      [];


    window.sidssDashboardCharts.placement =
      new Chart(
        placementCanvas,
        {

          type: 'bar',

          data: {

            labels:
              data.map(function(item) {

                return item.department;

              }),

            datasets: [

              {

                label:
                  'Placement %',

                data:
                  data.map(function(item) {

                    return item.percentage;

                  }),

                borderWidth: 1

              }

            ]

          },

          options: {

            responsive: true,

            maintainAspectRatio: false,

            scales: {

              y: {

                beginAtZero: true,

                max: 100,

                ticks: {

                  callback:
                    function(value) {

                      return value + '%';

                    }

                }

              }

            },

            plugins: {

              legend: {

                display: false

              }

            }

          }

        }
      );

  }


  // ==================================================
  // 2. CGPA DISTRIBUTION
  // ==================================================

  const cgpaCanvas =
    document.getElementById(
      'cgpaDistributionChart'
    );


  if (cgpaCanvas) {

    const distribution =
      charts.cgpaDistribution ||
      {};


    const labels =
      Object.keys(
        distribution
      );


    const values =
      labels.map(function(label) {

        return distribution[label];

      });


    window.sidssDashboardCharts.cgpa =
      new Chart(
        cgpaCanvas,
        {

          type: 'bar',

          data: {

            labels: labels,

            datasets: [

              {

                label:
                  'Students',

                data:
                  values,

                borderWidth: 1

              }

            ]

          },

          options: {

            responsive: true,

            maintainAspectRatio: false,

            scales: {

              y: {

                beginAtZero: true,

                ticks: {

                  precision: 0

                }

              }

            },

            plugins: {

              legend: {

                display: false

              }

            }

          }

        }
      );

  }


  // ==================================================
  // 3. ATTENDANCE TREND
  // ==================================================

  const attendanceCanvas =
    document.getElementById(
      'attendanceTrendChart'
    );


  if (attendanceCanvas) {

    const data =
      charts.attendanceTrend ||
      [];


    window.sidssDashboardCharts.attendance =
      new Chart(
        attendanceCanvas,
        {

          type: 'line',

          data: {

            labels:
              data.map(function(item) {

                return item.month;

              }),

            datasets: [

              {

                label:
                  'Average Attendance',

                data:
                  data.map(function(item) {

                    return item.average;

                  }),

                tension: 0.35,

                fill: false,

                borderWidth: 2

              }

            ]

          },

          options: {

            responsive: true,

            maintainAspectRatio: false,

            scales: {

              y: {

                beginAtZero: true,

                max: 100,

                ticks: {

                  callback:
                    function(value) {

                      return value + '%';

                    }

                }

              }

            }

          }

        }
      );

  }

}

function createStatCard(

      </p>

    </div>

  `;

}

/* =====================================================
   PERFORMANCE ROW
===================================================== */

function createPerformanceRow(
  title,
  percentage,
  value
) {

  percentage =
    Math.max(
      0,
      Math.min(
        Number(percentage || 0),
        100
      )
    );

  return `

    <div class="performance-row">

      <div class="performance-info">

        <span>
          ${escapeHtml(title)}
        </span>

        <strong>
          ${escapeHtml(value)}
        </strong>

      </div>

      <div class="progress-track">

        <div
          class="progress-value"
          style="width:${percentage}%">
        </div>

      </div>

    </div>

  `;

}

function viewAtRiskStudent(index) {

  const students =
    window.currentAtRiskStudents || [];

  const student =
    students[index];

  if (!student) {
    return;
  }


  // ============================================
  // SELECTED STUDENT
  // ============================================

  window.selectedStudent =
    student;


  // ============================================
  // BASIC STUDENT DATA
  // ============================================

  const usn =
    getStudentField(
      student,
      [
        'USN',
        'Student_ID',
        'Student_Id'
      ]
    );


  const name =
    getStudentField(
      student,
      [
        'Student_Name',
        'Name',
        'Full_Name'
      ]
    ) || 'Student';


  const email =
    getStudentField(
      student,
      [
        'Email',
        'Student_Email'
      ]
    ) || '-';


  const department =
    getStudentField(
      student,
      [

        'Dept',
        'Branch'

    getStudentField(
      student,

  // ============================================

    risk.cgpa !== null &&

                <th></th>

              </tr>

            </thead>


            <tbody id="studentsTableBody">

            </tbody>

          </table>

        </div>

      </div>

  `;


  // ==========================================
  // DISPLAY STUDENTS / GLOBAL SEARCH
  // ==========================================

  let studentsToDisplay =
    window.sidssStudents || [];


  if (window.sidssGlobalStudentSearch) {

    const query =
      String(
        window.sidssGlobalStudentSearch
      )
      .toLowerCase()
      .trim();


    const searchBox =
      document.getElementById(
        'studentSearch'
      );


    if (searchBox) {
      searchBox.value =
        window.sidssGlobalStudentSearch;
    }


    if (query) {

      studentsToDisplay =
        window.sidssStudents.filter(
          function(student) {

            if (!student) {
              return false;
            }


            /*
            * Search ALL student fields.
            * This includes:
            * Name
            * USN
            * Email
            * Department
            * Semester
            * etc.
            */

            const searchableText =
              Object.keys(student)
                .map(function(key) {

                  return String(
                    student[key] ?? ""
                  );

                })
                .join(" ")
                .toLowerCase();


            return searchableText
              .includes(query);

          }
        );

    }


    // Clear temporary global search
    window.sidssGlobalStudentSearch = "";

  }


  // ==========================================
  // SHOW ONLY THE REQUIRED STUDENTS
  // ==========================================

  displayStudents(
    studentsToDisplay
  );

}

function submitNewStudent(event) {

  event.preventDefault();


  const message =
    document.getElementById('addStudentMessage');

  const button =
    document.getElementById('saveStudentButton');


  const student = {

    usn:
      document
        .getElementById('newStudentUSN')
        .value
        .trim(),

    name:
      document
        .getElementById('newStudentName')
        .value
        .trim(),

    email:
      document
        .getElementById('newStudentEmail')
        .value
        .trim(),

    semester:
      document
        .getElementById('newStudentSemester')
        .value,

    status:
      document
        .getElementById('newStudentStatus')
        .value

  };


  // Basic validation
  if (
    !student.usn ||
    !student.name ||
    !student.email ||
    !student.semester
  ) {

    message.innerHTML =
      'Please fill all required fields.';

    return;

  }


  // Disable button while saving
  button.disabled = true;

  button.textContent = 'Adding...';


  message.innerHTML = '';


  google.script.run

    .withSuccessHandler(function(result) {

      button.disabled = false;

      button.textContent = 'Add Student';


      if (!result.success) {

        message.innerHTML =
          escapeHtml(result.message);

        return;

      }


      // Close popup
      closeAddStudentModal();


      // Reload student list from Google Sheet
      loadStudents();

    })


    .withFailureHandler(function(error) {

      button.disabled = false;

      button.textContent = 'Add Student';


      message.innerHTML =
        'Error: ' +
        escapeHtml(error.message);

    })


    .addStudent(
      student,
      currentUser
    );

}

function closeAddStudentModal() {

  const modal =
    document.getElementById('addStudentModal');

  if (modal) {
    modal.remove();
  }

}

  /* =====================================================

     ===================================================== */

  if (

  ) {

    window.sidssStudentTableState = {

      page: 1,

      pageSize: 10,

      sortKey: '',

      sortDirection: 'asc'

    };

  }


  const state =
    window.sidssStudentTableState;


  /* =====================================================
     GET FIELD
     ===================================================== */

  function field(
    student,
    names
  ) {

    return getStudentField(
      student,
      names
    );

  }


  /* =====================================================
     SORT
     ===================================================== */

  function sortedRecords() {

    const result =
      students.slice();


    if (!state.sortKey) {
      return result;
    }


    result.sort(
      function(a, b) {

        let aValue = '';
        let bValue = '';


        if (
          state.sortKey ===
          'name'
        ) {

          aValue =
            field(
              a,
              [
                'Student_Name',
                'Name',
                'Full_Name'
              ]
            );

          bValue =
            field(
              b,
              [
                'Student_Name',
                'Name',
                'Full_Name'
              ]
            );

        }


        else if (
          state.sortKey ===
          'usn'
        ) {

          aValue =
            field(
              a,
              [
                'USN',
                'Student_ID',
                'Student_Id'
              ]
            );

          bValue =
            field(
              b,
              [
                'USN',
                'Student_ID',
                'Student_Id'
              ]
            );

        }


        else if (
          state.sortKey ===
          'department'
        ) {

          aValue =
            field(
              a,
              [
                'Department',
                'Dept',
                'Branch'
              ]
            );

          bValue =
            field(
              b,
              [
                'Department',
                'Dept',
                'Branch'
              ]
            );

        }


        else if (
          state.sortKey ===
          'semester'
        ) {

          aValue =
            field(
              a,
              [
                'Semester',
                'Sem',
                'Current_Semester'
              ]
            );

          bValue =
            field(
              b,
              [
                'Semester',
                'Sem',
                'Current_Semester'
              ]
            );

        }


        else if (
          state.sortKey ===
          'status'
        ) {

          aValue =
            field(
              a,
              [
                'Status',
                'Student_Status'
              ]
            ) || 'Active';

          bValue =
            field(
              b,
              [
                'Status',
                'Student_Status'
              ]
            ) || 'Active';

        }


        aValue =
          String(
            aValue || ''
          )
            .trim()
            .toLowerCase();


        bValue =
          String(
            bValue || ''
          )
            .trim()
            .toLowerCase();


        const comparison =
          aValue.localeCompare(
            bValue,
            undefined,
            {
              numeric: true,
              sensitivity: 'base'
            }
          );


        return state.sortDirection === 'asc'
          ? comparison
          : -comparison;

      }
    );


    return result;

  }


  /* =====================================================
     HEADER
     ===================================================== */

  const thead =
    table.querySelector('thead');


  if (thead) {

        </th>

        </th>


        <th
          class="sidss-sortable-header"

          <span>STATUS</span>

          <span
            class="sidss-header-arrow"
            data-arrow="status">

            ↕

          </span>

        </th>


        <th>
          ACTION
        </th>

    `;


    /* =====================================================

      ===================================================== */

      headerStyle.textContent = `

          ================================================ */

        .sidss-sortable-header {

          cursor: pointer;

          user-select: none;

          white-space: nowrap;

          color: #6f89a8;

          font-size: 10px;

            color .18s ease;

        }


        .sidss-sortable-header:hover {

          color: #a8bdd5;

        }


        .sidss-sortable-header

          display: inline-block;

        }

    /* =====================================================

      ===================================================== */

    thead

      )

        function(header) {

          header.addEventListener(

              const key =

                    ? 'desc'

              }

              displayStudents(

    /* =====================================================
      SORT ARROWS
      ===================================================== */

    thead
      .querySelectorAll(

        function(arrow) {

        state.pageSize

  if (

  const start =

      state.page - 1

  const end =

      start +
      state.pageSize,

  const visible =

              <td>

                ${escapeHtml(

              </td>


              <td>

                  ${escapeHtml(

          `;

  /* =====================================================
     COUNT
     ===================================================== */

  const count =
    document.getElementById(
      'visibleStudentCount'
    );


  if (count) {

    count.textContent =
      totalRecords +
      ' records';

  }


  /* =====================================================
     PAGINATION UI
     ===================================================== */

  let pagination =

  if (!pagination) {

      );

    table.parentNode
      .insertBefore(

        table.nextSibling
      );

  }


  const from =
    start + 1;


  const to =
    end;


  let pages = '';


  for (
    let page = 1;
    page <= totalPages;
    page++
  ) {

    if (
      totalPages <= 7 ||
      page === 1 ||
      page === totalPages ||
      Math.abs(
        page - state.page
      ) <= 1
    ) {

      pages += `

        <button
          type="button"
          class="sidss-page-button
            ${page === state.page
              ? 'active'
              : ''}"
          data-page="${page}">

          ${page}

        </button>

      `;

    }

    else if (
      page === 2 ||
      page === totalPages - 1
    ) {

      pages += `

        <span
          class="sidss-page-dots">

          …

        </span>

      `;

    }

  }


  pagination.innerHTML = `

    <div
      class="sidss-pagination-info">

      Showing

      <strong>
        ${from}-${to}
      </strong>

      of

      <strong>
        ${totalRecords}
      </strong>

      students

    </div>


    <div
      class="sidss-pagination-controls">

      <button
        type="button"
        class="sidss-page-button"
        data-page="prev"
        ${state.page === 1
          ? 'disabled'
          : ''}>

        ‹

      </button>


      ${pages}


      <button
        type="button"
        class="sidss-page-button"
        data-page="next"
        ${state.page === totalPages
          ? 'disabled'
          : ''}>

        ›

      </button>

    </div>

  `;


  /* =====================================================
     PAGINATION EVENTS
     ===================================================== */

  pagination
    .querySelectorAll(
      '[data-page]'
    )
    .forEach(
      function(button) {

        button.addEventListener(
          'click',
          function() {

            const requested =
              button.dataset.page;


            if (
              requested === 'prev'
            ) {

              if (
                state.page > 1
              ) {

                state.page--;

              }

            }

            else if (
              requested === 'next'
            ) {

              if (
                state.page <
                totalPages
              ) {

                state.page++;

              }

            }

            else {

              state.page =
                Number(
                  requested
                );

            }


            displayStudents(
              students
            );

          }
        );

      }
    );

}


/* =====================================================
   FIELD HELPER
===================================================== */

function getStudentField(
  student,
  fields
) {

  for (
    let i = 0;
    i < fields.length;
    i++
  ) {

    if (
      student[fields[i]] !== undefined &&
      student[fields[i]] !== null &&
      student[fields[i]] !== ''
    ) {

      return student[fields[i]];

    }

  }

  return '';

}


/* =====================================================
   SEARCH
===================================================== */

function filterStudents() {

  const searchInput =
    document.getElementById("studentSearch");

  if (!searchInput) {
    return;
  }

  const search =
    String(searchInput.value || "")
      .toLowerCase()
      .trim();

  const students =
    Array.isArray(window.sidssStudents)
      ? window.sidssStudents
      : [];

  // No search → show all students
  if (!search) {

    displayStudents(students);

    const count =
      document.getElementById("visibleStudentCount");

    if (count) {
      count.textContent =
        students.length + " records";
    }

    return;
  }

  // Search name, USN, email, department,
  // semester, status, etc.
  const filtered =
    students.filter(function(student) {

      if (!student) {
        return false;
      }

      const searchableText =
        Object.keys(student)
          .map(function(key) {
            return String(student[key] ?? "");
          })
          .join(" ")
          .toLowerCase();

      return searchableText.includes(search);

    });

  // Display only matching students
  displayStudents(filtered);

  // Update visible count
  const count =
    document.getElementById("visibleStudentCount");

  if (count) {

    count.textContent =
      filtered.length +
      (filtered.length === 1
        ? " record"
        : " records");

  }

}

function viewStudent(index) {

  const student =
    window.sidssStudents[index];


  if (!student) {
    return;
  }


  const usn =
    getStudentField(
      student,
      [
        'USN',
        'Student_ID',
        'Student_Id'
      ]
    );


  if (!usn) {

    showPageError(
      'USN not available for this student.'
    );

    return;

  }


  document
    .getElementById('currentPageLabel')
    .textContent =
      'Student 360° Profile';


  document
    .getElementById('mainContent')
    .innerHTML = `

      <div class="dashboard-loading">

        <div class="loader"></div>

        <p>
          Building 360° student intelligence profile...
        </p>

      </div>

    `;


  google.script.run

    .withSuccessHandler(
      function(result) {

        if (!result.success) {

          showPageError(
            result.message
          );

          return;

        }


        renderStudent360(
          result
        );

      }
    )


    .withFailureHandler(
      function(error) {

        showPageError(
          error.message
        );

      }
    )


    .getStudent360(
      currentUser,
      usn
    );

}

function submitStudentUpdate(event) {

  event.preventDefault();


  const button =
    document.getElementById('updateStudentButton');

  const message =
    document.getElementById('editStudentMessage');


  const student = {

    usn:
      document
        .getElementById('editStudentUSN')
        .value
        .trim(),

    name:
      document
        .getElementById('editStudentName')
        .value
        .trim(),

    email:
      document
        .getElementById('editStudentEmail')
        .value
        .trim(),

    phone:
      document
        .getElementById('editStudentPhone')
        .value
        .trim(),

    semester:
      document
        .getElementById('editStudentSemester')
        .value,

    section:
      document
        .getElementById('editStudentSection')
        .value
        .trim(),

    status:
      document
        .getElementById('editStudentStatus')
        .value

  };


  button.disabled = true;
  button.textContent = 'Updating...';

  message.innerHTML = '';


  google.script.run

    .withSuccessHandler(function(result) {

      button.disabled = false;
      button.textContent = 'Update Student';


      if (!result.success) {

        message.className =
          'sidss-form-message error-message';

        message.textContent =
          result.message;

        return;

      }


      message.className =
        'sidss-form-message success-message';

      message.textContent =
        result.message;


      setTimeout(function() {

        closeEditStudentModal();

        // Refresh student data first
        loadStudents();

      }, 700);

    })


    .withFailureHandler(function(error) {

      button.disabled = false;
      button.textContent = 'Update Student';

      message.className =
        'sidss-form-message error-message';

      message.textContent =
        error.message;

    })


    .updateStudent(
      student,
      currentUser
    );

}

function createDatasetSection(
  label,
  title,
  records
) {

  records = records || [];


  let content = '';


  if (!records.length) {

    content = `

      <div class="profile-empty">

        No records available

      </div>

    `;

  }

  else {

    content =
      records
        .slice(0, 6)
        .map(function(record) {

          const fields =
            Object.entries(record)
              .filter(function(entry) {

                return (
                  entry[1] !== '' &&
                  entry[1] !== null &&
                  entry[1] !== undefined
                );

              })
              .slice(0, 6);


          return `

            <div class="dataset-record">

              ${fields
                .map(function(entry) {

                  return `

                    <div>

                      <span>
                        ${escapeHtml(
                          formatFieldName(
                            entry[0]
                          )
                        )}
                      </span>

                      <strong>
                        ${escapeHtml(
                          entry[1]
                        )}
                      </strong>

                    </div>

                  `;

                })
                .join('')}

            </div>

          `;

        })
        .join('');

  }


  return `

    <div class="profile-section dataset-section">

      <div class="profile-section-heading">

        <span class="section-label">
          ${escapeHtml(label)}
        </span>

        <h3>
          ${escapeHtml(title)}
        </h3>

      </div>

      ${content}

    </div>

  `;

}


/* =====================================================
   FIELD NAME FORMATTER
===================================================== */

function formatFieldName(name) {

  return String(name)
    .replace(/_/g, ' ')
    .replace(
      /\b\w/g,
      function(letter) {
        return letter.toUpperCase();
      }
    );

}


/* =====================================================
   CGPA
===================================================== */

function getProfileCGPA(records) {

  if (!records || !records.length) {
    return '0.00';
  }


  for (
    let i = records.length - 1;
    i >= 0;
    i--
  ) {

    const value =
      getStudentField(
        records[i],
        [
          'CGPA',
          'Current_CGPA',
          'Overall_CGPA'
        ]
      );


    if (
      value !== '' &&
      !isNaN(Number(value))
    ) {

      return Number(value)
        .toFixed(2);

    }

  }


  return '0.00';

}


/* =====================================================
   ATTENDANCE
===================================================== */

function getProfileAttendance(records) {

  if (!records || !records.length) {
    return '0.0';
  }


  const values =
    records
      .map(function(record) {

        return Number(
          getStudentField(
            record,
            [
              'Overall_Attendance_%',
              'Attendance_Percentage',
              'Attendance',
              'Percentage'
            ]
          )
        );

      })
      .filter(function(value) {

        return !isNaN(value) &&
               value >= 0;

      });


  if (!values.length) {
    return '0.0';
  }


  const total =
    values.reduce(
      function(sum, value) {
        return sum + value;
      },
      0
    );


  return (
    total / values.length
  ).toFixed(1);

}


/* =========================================
   PLACEMENT STATUS
========================================= */

function getPlacementStatus(records) {

  if (!records || !records.length) {
    return 'Not Placed';
  }


  for (
    let i = 0;
    i < records.length;
    i++
  ) {

    const offerStatus =
      String(
        getStudentField(
          records[i],
          [
            'Offer_Status'
          ]
        ) || ''
      )
      .trim()
      .toLowerCase();


    const selectedCompany =
      getStudentField(
        records[i],
        [
          'Selected_Company'
        ]
      );


    if (
      offerStatus === 'yes' ||
      selectedCompany
    ) {

      return selectedCompany
        ? 'Placed - ' + selectedCompany
        : 'Placed';

    }

  }


  return 'Not Placed';

}

/* =====================================================
   KPI CARD
===================================================== */

function academicKPI(
  title,
  value,
  subtitle,
  icon
) {

  let filterType = 'all';

  if (title === 'Students') {
    filterType = 'all';
  }

  else if (title === 'Average SGPA') {
    filterType = 'average';
  }

  else if (title === 'Top SGPA') {
    filterType = 'top';
  }

  else if (title === 'Needs Attention') {
    filterType = 'attention';
  }


  return `

    <div
      class="academic-kpi-card clickable-kpi"
      onclick="filterAcademicKPI('${filterType}')"
      style="cursor:pointer;"
    >

      <div class="academic-kpi-top">

        <div class="academic-kpi-icon">
          ${icon}
        </div>

        <span class="live-indicator">
          ● LIVE
        </span>

      </div>


      <strong>
        ${escapeHtml(value)}
      </strong>


      <h4>
        ${escapeHtml(title)}
      </h4>


      <p>
        ${escapeHtml(subtitle)}
      </p>

    </div>

  `;

}

function filterAcademicKPI(type) {

  const records =
    window.sidssAcademicRecords || [];


  if (!records.length) {
    return;
  }


  let filtered = [];


  // 1. ALL STUDENTS
  if (type === 'all') {

    filtered = records;

  }


  // 2. STUDENTS AT OR ABOVE AVERAGE SGPA
  else if (type === 'average') {

    const validRecords =
      records.filter(function(record) {

        const sgpa =
          Number(record.sgpa || 0);

        return !isNaN(sgpa) && sgpa > 0;

      });


    const average =
      validRecords.length
        ? validRecords.reduce(
            function(total, record) {

              return total +
                Number(record.sgpa || 0);

            },
            0
          ) / validRecords.length
        : 0;


    filtered =
      records.filter(function(record) {

        return Number(
          record.sgpa || 0
        ) >= average;

      });

  }


  // 3. TOP SGPA STUDENT(S)
  else if (type === 'top') {

    const topSGPA =
      Math.max.apply(
        null,
        records.map(function(record) {

          return Number(
            record.sgpa || 0
          );

        })
      );


    filtered =
      records.filter(function(record) {

        return Number(
          record.sgpa || 0
        ) === topSGPA;

      });

  }


  // 4. NEEDS ATTENTION
  else if (type === 'attention') {

    filtered =
      records.filter(function(record) {

        const sgpa =
          Number(record.sgpa || 0);

        return (
          sgpa > 0 &&
          sgpa < 6.5
        );

      });

  }


  displayAcademicRecords(filtered);


  // Scroll smoothly to the filtered table
  const table =
    document.getElementById(
      'academicTableBody'
    );

  if (table) {

    table.scrollIntoView({
      behavior: 'smooth',
      block: 'start'
    });

  }

}

  `;

  const records =
    window.sidssAttendanceRecords || [];

  let filtered = records;

  // ALL STUDENTS / RECORDS
  if (type === 'all') {

    filtered = records;

  }

  // AVERAGE ATTENDANCE
  else if (type === 'average') {

    if (!records.length) {
      filtered = [];
    }
    else {

      const total = records.reduce(function(sum, record) {
        return sum + Number(record.percentage || 0);
      }, 0);

      const average = total / records.length;

      // Show records around department average
      filtered = records.filter(function(record) {

        const value =
          Number(record.percentage || 0);

        return Math.abs(value - average) <= 5;

      });

    }

  }

  // HIGHEST ATTENDANCE
  else if (type === 'highest') {

    if (!records.length) {

      filtered = [];

    }
    else {

      const highest = Math.max.apply(
        null,
        records.map(function(record) {
          return Number(record.percentage || 0);
        })
      );

      filtered = records.filter(function(record) {

        return Number(
          record.percentage || 0
        ) === highest;

      });

    }

  }

  // BELOW 75%
  else if (type === 'shortage') {

    filtered = records.filter(function(record) {

      return Number(
        record.percentage || 0
      ) < 75;

    });

  }

  displayAttendanceRecords(filtered);

  // Scroll to table
  const table =
    document.getElementById(
      'attendanceTableBody'
    );

  if (table) {

    table.scrollIntoView({
      behavior: 'smooth',
      block: 'start'

function getPlacementField(
  student,
  fieldNames
) {

  if (!student) {
    return '';
  }

  for (
    let i = 0;
    i < fieldNames.length;
    i++
  ) {

    const key =
      Object.keys(student).find(
        function(existingKey) {

          return String(existingKey)
            .trim()
            .toLowerCase()
            ===
            String(fieldNames[i])
              .trim()
              .toLowerCase();

        }
      );

    if (
      key !== undefined &&
      student[key] !== null &&
      student[key] !== ''
    ) {

      return student[key];

    }

  }

  return '';

}


function getPlacementNumber(
  student,
  fieldNames
) {

  const value =
    getPlacementField(
      student,
      fieldNames
    );

  const number =
    Number(
      String(value)
        .replace(/[^0-9.-]/g, '')
    );

  return Number.isFinite(number)
    ? number
    : 0;

}

}

    document.getElementById(
      'decisionReadiness'
    )?.value.trim() || '';

  const packageInput =
    document.getElementById(
      'decisionPackage'
    )?.value.trim() || '';

  const aptitude =
    aptitudeInput === ''
      ? null
      : Number(aptitudeInput);

  const coding =
    codingInput === ''
      ? null
      : Number(codingInput);

  const communication =
    communicationInput === ''
      ? null
      : Number(communicationInput);

  const readiness =
    readinessInput === ''
      ? null
      : Number(readinessInput);

  const packageMinimum =
    packageInput === ''
      ? null
      : Number(packageInput);

  const placementStatus =
    String(
      document.getElementById(
        'decisionPlacementStatus'
      )?.value || ''
    )
    .trim()
    .toLowerCase();


  // ========================================
  // ROBUST FIELD READER
  // ========================================

  function readField(student, names) {

    if (!student) {
      return '';
    }

    const keys =
      Object.keys(student);

    for (let i = 0; i < names.length; i++) {

      const wanted =
        String(names[i])
          .trim()
          .toLowerCase()
          .replace(/[\s_-]/g, '');

      for (let j = 0; j < keys.length; j++) {

        const actual =
          String(keys[j])
            .trim()
            .toLowerCase()
            .replace(/[\s_-]/g, '');

        if (actual === wanted) {

          return student[keys[j]];

        }

      }

    }

    return '';
  }


  // ========================================
  // ROBUST NUMBER READER
  // ========================================

  function readNumber(student, names) {

    const raw =
      readField(
        student,
        names
      );

    if (
      raw === null ||
      raw === undefined ||
      raw === ''
    ) {

      return 0;

    }

    // Handles:
    // 90
    // "90"
    // "90/100"
    // "20.0 LPA"
    // "20 LPA"
    // "₹20 LPA"

    const text =
      String(raw)
        .trim()
        .replace(/,/g, '');

    const match =
      text.match(
        /-?\d+(?:\.\d+)?/
      );

    if (!match) {
      return 0;
    }

    const value =
      Number(match[0]);

    return Number.isFinite(value)
      ? value
      : 0;
  }


  // ========================================
  // FILTER
  // ========================================

  const filtered =
    records.filter(
      function(student) {


        // ------------------------------------
        // ELIGIBILITY
        // ------------------------------------

        if (
          eligibility === 'yes' ||
          eligibility === 'no'
        ) {

          const rawEligibility =
            String(
              readField(
                student,
                [
                  'Eligible',
                  'Eligibility',
                  'Placement_Eligible',
                  'Placement Eligibility'
                ]
              )
            )
            .trim()
            .toLowerCase();

          const isEligible =
            rawEligibility === 'yes' ||
            rawEligibility === 'true' ||
            rawEligibility === 'eligible' ||
            rawEligibility === '1';

          if (
            eligibility === 'yes' &&
            !isEligible
          ) {

            return false;

          }

          if (
            eligibility === 'no' &&
            isEligible
          ) {

            return false;

          }

        }


        // ------------------------------------
        // DEPARTMENT
        // ------------------------------------

        if (department) {

          const studentDepartment =
            String(
              readField(
                student,
                [
                  'Department',
                  'Dept',
                  'Branch',
                  'Department_Name'
                ]
              )
            )
            .trim()
            .toLowerCase();

          if (
            !studentDepartment ||
            !studentDepartment.includes(
              department
            )
          ) {

            return false;

          }

        }


        // ------------------------------------
        // APTITUDE
        // ------------------------------------

        if (
          aptitude !== null &&
          Number.isFinite(aptitude)
        ) {

          const value =
            readNumber(
              student,
              [
                'Aptitude',
                'Aptitude_Score',
                'Aptitude Score'
              ]
            );

          if (value < aptitude) {

            return false;

          }

        }


        // ------------------------------------
        // CODING
        // ------------------------------------

        if (
          coding !== null &&
          Number.isFinite(coding)
        ) {

          const value =
            readNumber(
              student,
              [
                'Coding',
                'Coding_Score',
                'Coding Score'
              ]
            );

          if (value < coding) {

            return false;

          }

        }


        // ------------------------------------
        // COMMUNICATION
        // ------------------------------------

        if (
          communication !== null &&
          Number.isFinite(communication)
        ) {

          const value =
            readNumber(
              student,
              [
                'Communication',
                'Comm',
                'Communication_Score',
                'Communication Score'
              ]
            );

          if (value < communication) {

            return false;

          }

        }


        // ------------------------------------
        // READINESS
        // ------------------------------------

        if (
          readiness !== null &&
          Number.isFinite(readiness)
        ) {

          const value =
            readNumber(
              student,
              [
                'Readiness',
                'Readiness_Score',
                'Readiness Score'
              ]
            );

          if (value < readiness) {

            return false;

          }

        }


        // ------------------------------------
        // PACKAGE
        // ------------------------------------

        if (
          packageMinimum !== null &&
          Number.isFinite(packageMinimum)
        ) {

          const value =
            readNumber(
              student,
              [
                'Package',
                'Package_LPA',
                'Package LPA',
                'Offer_Package',
                'Package_LPA_Value',
                'Highest_Package'
              ]
            );

          if (
            value < packageMinimum
          ) {

            return false;

          }

        }


        // ------------------------------------
        // PLACEMENT STATUS
        // ------------------------------------

        if (
          placementStatus === 'placed' ||
          placementStatus === 'not placed'
        ) {

          const rawOffer =
            String(
              readField(
                student,
                [
                  'Offer',
                  'Offer Status',
                  'Offer_Status',
                  'Placement_Status',
                  'Placement Status',
                  'Status'
                ]
              )
            )
            .trim()
            .toLowerCase();

          const isPlaced =
            rawOffer === 'yes' ||
            rawOffer === 'placed' ||
            rawOffer === 'true';

          if (
            placementStatus === 'placed' &&
            !isPlaced
          ) {

            return false;

          }

          if (
            placementStatus === 'not placed' &&
            isPlaced
          ) {

            return false;

          }

        }


        return true;

      }
    );


  // ========================================
  // SHOW RESULTS
  // ========================================

  displayPlacementRecords(
    filtered
  );


  const summary =
    document.getElementById(
      'decisionFilterSummary'
    );
  
  // ========================================
  // CLOSE FILTER MODAL
  // ========================================

  const modal =
    document.getElementById(
      'placementDecisionFilter'
    );

  if (modal) {

    modal.style.display =
      'none';

    modal.classList.remove(
      'active',
      'show'
    );

  }


  // ========================================
  // PREMIUM SUCCESS MESSAGE
  // ========================================

  showDecisionFilterToast(
    filtered.length +
    ' student' +
    (
      filtered.length === 1
        ? ''
        : 's'
    ) +
    ' match your requirements.'
  );

  if (summary) {

    summary.textContent =
      filtered.length +
      ' student' +
      (
        filtered.length === 1
          ? ''
          : 's'
      ) +
      ' match the selected requirements.';

  }


  const count =
    document.getElementById(
      'placementRecordCount'
    );

  if (count) {

    count.textContent =
      filtered.length +
      ' placement records';

  }

}


function clearPlacementDecisionFilter() {

  const ids = [

    'decisionEligibility',
    'decisionDepartment',
    'decisionAptitude',
    'decisionCoding',
    'decisionCommunication',
    'decisionReadiness',
    'decisionPackage',
    'decisionPlacementStatus'

  ];


  ids.forEach(
    function(id) {

      const element =
        document.getElementById(id);

      if (!element) {
        return;
      }

      if (
        element.tagName === 'SELECT'
      ) {

        element.value = '';

      } else {

        element.value = '';

      }

    }
  );


  const summary =
    document.getElementById(
      'decisionFilterSummary'
    );


  if (summary) {
    summary.textContent = '';
  }


  const count =
    document.getElementById(
      'placementRecordCount'
    );


  if (count) {

    count.textContent =
      window.sidssPlacementRecords.length +
      ' placement records';

  }


  displayPlacementRecords(
    window.sidssPlacementRecords || []
  );

}


/* =====================================================
   KPI CARD
===================================================== */

function placementKPI(
  title,
  value,
  subtitle,
  icon
) {

  let filterType = '';

  if (title === 'Eligible Students') {
    filterType = 'eligible';
  }

  else if (title === 'Placed Students') {
    filterType = 'placed';
  }

  else if (title === 'Avg Readiness') {
    filterType = 'readiness';
  }

  else if (title === 'Highest Package') {
    filterType = 'package';
  }


  return `

    <div
      class="placement-kpi-card clickable-kpi"
      onclick="filterPlacementKPI('${filterType}')"
      title="Click to view details"
    >

      <div class="placement-kpi-top">

        <div class="placement-kpi-icon">
          ${icon}
        </div>

        <span class="kpi-live">LIVE</span>

      </div>


      <strong>
        ${escapeHtml(value)}
      </strong>


      <h4>
        ${escapeHtml(title)}
      </h4>


      <p>
        ${escapeHtml(subtitle)}
      </p>

    </div>

  `;

}

/* =====================================================
   READINESS BAR
===================================================== */

function placementHealthItem(
  title,
  percentage,
  value
) {

  percentage =
    Math.max(
      0,
      Math.min(
        Number(percentage || 0),
        100
      )
    );


  return `

    <div class="placement-health-row">

      <div>

        <span>
          ${escapeHtml(title)}
        </span>

        <strong>
          ${escapeHtml(value)} / 100
        </strong>

      </div>


      <div class="placement-progress">

        <div
          style="width:${percentage}%">
        </div>

      </div>

    </div>

  `;

}


/* =====================================================
   DISPLAY PLACEMENT RECORDS
===================================================== */

function displayPlacementRecords(records) {

  const body =
    document.getElementById('placementTableBody');

  const count =
    document.getElementById('placementRecordCount');


  if (!body) {
    console.error('placementTableBody not found');
    return;
  }


  records =
    Array.isArray(records)
      ? records
      : [];


  if (count) {
    count.textContent =
      records.length + ' placement records';
  }


  if (records.length === 0) {

    body.innerHTML = `
      <tr>
        <td colspan="12" class="empty-table">
          No placement records found.
        </td>
      </tr>
    `;

    return;
  }


  body.innerHTML =
    records.map(function(record) {

      const usn =
        String(record.usn || '').trim();

      const name =
        String(record.name || 'Student').trim();

      const department =
        String(record.department || '').trim();

      const initial =
        name
          ? name.charAt(0).toUpperCase()
          : 'S';


      const readiness =
        Number(record.readiness || 0);

      const packageValue =
        Number(record.packageLPA || 0);


      const eligible =
        String(record.eligibility || '')
          .trim()
          .toLowerCase() === 'yes';


      const hasOffer =
        String(record.offerStatus || '')
          .trim()
          .toLowerCase() === 'yes';


      let readinessClass =
        'placement-medium';

      if (readiness >= 80) {
        readinessClass =
          'placement-high';
      }

      else if (readiness < 65) {
        readinessClass =
          'placement-low';
      }


      return `

        <tr>

          <!-- STUDENT -->

          <td>

            <div class="student-name-cell">

              <div class="student-avatar">
                ${escapeHtml(initial)}
              </div>

              <div>

                <strong>
                  ${escapeHtml(name)}
                </strong>

                <span>
                  ${escapeHtml(department)}
                </span>

              </div>

            </div>

          </td>


          <!-- USN -->

          <td class="usn-cell">
            ${escapeHtml(usn || '-')}
          </td>


          <!-- ELIGIBILITY -->

          <td>

            <span class="${
              eligible
                ? 'placement-yes'
                : 'placement-no'
            }">

              ${
                eligible
                  ? '● Yes'
                  : '● No'
              }

            </span>

          </td>


          <!-- APTITUDE -->

          <td>
            ${escapeHtml(
              record.aptitude ?? '-'
            )}
          </td>


          <!-- CODING -->

          <td>
            ${escapeHtml(
              record.coding ?? '-'
            )}
          </td>


          <!-- COMMUNICATION -->

          <td>
            ${escapeHtml(
              record.communication ?? '-'
            )}
          </td>


          <!-- INTERVIEW -->

          <td>

            <span class="interview-status">

              ${escapeHtml(
                record.interviewStatus || '-'
              )}

            </span>

          </td>


          <!-- COMPANY -->

          <td>

            ${escapeHtml(
              record.selectedCompany ||
              record.companyApplied ||
              '-'
            )}

          </td>


          <!-- READINESS -->

          <td>

            <span class="${readinessClass}">

              ${readiness.toFixed(1)}

            </span>

          </td>


          <!-- OFFER -->

          <td>

            <span class="${
              hasOffer
                ? 'placement-offer'
                : 'placement-no-offer'
            }">

              ${
                hasOffer
                  ? '● Yes'
                  : 'No'
              }

            </span>

          </td>


          <!-- PACKAGE -->

          <td>

            <strong class="package-value">

              ${
                packageValue > 0
                  ? packageValue.toFixed(1) +
                    ' LPA'
                  : '-'
              }

            </strong>

          </td>


          <!-- ACTIONS -->

          <td>

            <div
              style="
                display:flex;
                align-items:center;
                gap:8px;
                min-width:150px;
                white-space:nowrap;
              "
            >

              <button
                type="button"
                class="view-student-button"
                onclick="openPlacementStudent('${escapeHtml(usn)}')"
              >
                View →
              </button>


              <button
                type="button"
                onclick="openEditPlacementModal('${escapeHtml(usn)}')"
                style="
                  display:inline-block !important;
                  visibility:visible !important;
                  opacity:1 !important;
                  background:#063b39;
                  border:1px solid #00d9b5;
                  color:#00f5cf;
                  padding:8px 15px;
                  border-radius:7px;
                  cursor:pointer;
                  font-size:12px;
                  font-weight:700;
                "
              >
                Edit
              </button>

            </div>

          </td>

        </tr>

      `;

    }).join('');

}

/* =====================================================
   KPI
===================================================== */

function skillsKPI(
  title,
  value,
  subtitle,
  icon
) {

  let filterType = 'all';

  if (title === 'Students') {
    filterType = 'students';
  }

  else if (title === 'Skill Records') {
    filterType = 'all';
  }

  else if (title === 'Advanced') {
    filterType = 'advanced';
  }

  else if (title === 'Verified') {
    filterType = 'verified';
  }


  return `

    <div
      class="skills-kpi-card clickable-kpi"
      onclick="filterSkillsKPI('${filterType}')"
    >

      <div class="skills-kpi-top">

        <div class="skills-kpi-icon">
          ${icon}
        </div>

        <span class="kpi-live">
          LIVE
        </span>

      </div>


      <strong>
        ${escapeHtml(value)}
      </strong>


      <h4>
        ${escapeHtml(title)}
      </h4>


      <p>
        ${escapeHtml(subtitle)}
      </p>

    </div>

  `;

}

function filterSkillsKPI(type) {

  const allRecords =
    window.sidssSkillsRecords || [];

  let filtered = allRecords;


  // ALL SKILL RECORDS
  if (type === 'all') {

    filtered = allRecords;

  }


  // STUDENTS
  else if (type === 'students') {

    const seen = new Set();

    filtered = allRecords.filter(function(record) {

      const usn =
        String(record.usn || '')
          .trim()
          .toLowerCase();

      if (!usn || seen.has(usn)) {
        return false;
      }

      seen.add(usn);

      return true;

    });

  }


  // ADVANCED SKILLS
  else if (type === 'advanced') {

    filtered = allRecords.filter(function(record) {

      return String(
        record.level || ''
      )
        .trim()
        .toLowerCase() === 'advanced';

    });

  }


  // VERIFIED SKILLS
  else if (type === 'verified') {

    filtered = allRecords.filter(function(record) {

      const verified =
        String(
          record.verified || ''
        )
          .trim()
          .toLowerCase();

      return (
        verified === 'yes' ||
        verified === 'verified' ||
        verified === 'true'
      );

    });

  }


  // Clear search box
  const search =
    document.getElementById('skillsSearch');

  if (search) {
    search.value = '';
  }


  // Show ONLY selected records
  displaySkillsRecords(filtered);


  // Scroll to directory
  const table =
    document.getElementById(
      'skillsTableBody'
    );

  if (table) {

    table.scrollIntoView({
      behavior: 'smooth',
      block: 'start'
    });

  }

}

   PROGRESS
===================================================== */

function skillsProgress(
  title,
  percentage,
  count
) {

  percentage =
    Math.max(
      0,
      Math.min(
        Number(percentage || 0),
        100
      )
    );


  return `

    <div class="skills-progress-item">

      <div>

        <span>
          ${escapeHtml(title)}
        </span>

        <strong>
          ${escapeHtml(count || 0)}
          records
        </strong>

      </div>

      <div class="skills-progress-bar">

        <div
          style="width:${percentage}%">
        </div>

      </div>

    </div>

  `;

}
