<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
  --bg: #020617;
  --panel: #0f172a;
  --card: rgba(15,23,42,.82);
  --border: rgba(148,163,184,.15);

  --blue: #3b82f6;
  --cyan: #06b6d4;

  --text: #f8fafc;
  --muted: #94a3b8;
  --green: #10b981;
  --red: #ef4444;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
}

.hidden {
  display: none !important;
}


/* ================= LOGIN ================= */

.login-page {
  min-height: 100vh;

  background:
    radial-gradient(circle at 15% 20%, rgba(37,99,235,.20), transparent 32%),
    radial-gradient(circle at 85% 80%, rgba(6,182,212,.12), transparent 30%),
    #020617;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 35px;
}

.login-wrapper {
  width: 100%;
  max-width: 1180px;
  min-height: 650px;

  display: grid;
  grid-template-columns: 1.1fr .9fr;

  overflow: hidden;

  border-radius: 28px;

  border: 1px solid var(--border);

  background: rgba(15,23,42,.60);

  box-shadow: 0 30px 100px rgba(0,0,0,.45);

  backdrop-filter: blur(25px);
}


/* ================= BRAND ================= */

.brand-panel {
  padding: 75px;

  display: flex;
  flex-direction: column;
  justify-content: center;

  position: relative;
}

.brand-logo,
.mobile-logo {

  width:105px;
  height: 72px;

  display: flex;
  justify-content: center;
  align-items: center;

  border-radius: 19px;

  font-size: 31px;
  font-weight: 800;

  background:
    linear-gradient(135deg,#2563eb,#06b6d4);

  box-shadow:
    0 15px 40px rgba(37,99,235,.35);
}

.brand-logo {
  margin-bottom: 35px;
}

.mobile-logo {
  display: none;
  margin-bottom: 25px;
}

.brand-badge {
  width: fit-content;

  padding: 8px 12px;

  border: 1px solid rgba(59,130,246,.25);

  background: rgba(37,99,235,.08);

  border-radius: 50px;

  color: #60a5fa;

  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.3px;

  margin-bottom: 22px;
}

.brand-panel h1 {
  font-size: 35px;
  line-height: 1.08;
  letter-spacing: -1px;

  margin-bottom: 25px;
}

.brand-panel h1 span {

  background:
    linear-gradient(90deg,#60a5fa,#22d3ee);

  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.brand-panel > p {
  max-width: 560px;

  color: var(--muted);

  line-height: 1.8;

  font-size: 15px;
}

.feature-row {
  display: flex;
  gap: 45px;

  margin-top: 55px;
}

.feature-row div {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.feature-row strong {
  font-size: 25px;
}

.feature-row span {
  color: var(--muted);
  font-size: 12px;
}


/* ================= LOGIN PANEL ================= */

.login-panel {

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 55px;

  background:
    rgba(2,6,23,.40);

  border-left: 1px solid var(--border);
}

.login-card {
  width: 100%;
  max-width: 390px;
}

.welcome {
  color: #60a5fa;

  font-size: 11px;
  font-weight: 800;

  letter-spacing: 1.5px;

  margin-bottom: 13px;
}

.login-card h2 {
  font-size: 30px;

  margin-bottom: 10px;
}

.login-description {
  color: var(--muted);

  font-size: 13px;

  margin-bottom: 35px;
}


/* ================= FORM ================= */

label {
  display: block;

  color: #cbd5e1;

  font-size: 12px;
  font-weight: 600;

  margin-bottom: 9px;
}

.input-box {
  height: 52px;

  display: flex;
  align-items: center;
  gap: 11px;

  padding: 0 15px;

  background: rgba(30,41,59,.65);

  border: 1px solid var(--border);

  border-radius: 12px;

  margin-bottom: 21px;

  transition: .2s;
}

.input-box:focus-within {
  border-color: #3b82f6;

  box-shadow:
    0 0 0 3px rgba(59,130,246,.10);
}

.input-box > span {
  color: #64748b;
}

.input-box input {
  width: 100%;

  border: none;
  outline: none;

  background: transparent;

  color: white;

  font-family: inherit;

  font-size: 14px;
}

.input-box input::placeholder {
  color: #475569;
}

.password-toggle {
  border: none;
  background: none;

  color: #60a5fa;

  cursor: pointer;

  font-size: 11px;
  font-weight: 600;
}

.primary-button {
  width: 100%;
  height: 52px;

  margin-top: 5px;

  border: none;

  border-radius: 12px;

  cursor: pointer;

  color: white;

  font-family: inherit;

  font-weight: 700;

  background:
    linear-gradient(135deg,#2563eb,#0891b2);

  box-shadow:
    0 10px 30px rgba(37,99,235,.25);

  transition: .2s;
}

.primary-button:hover {
  transform: translateY(-1px);

  box-shadow:
    0 15px 35px rgba(37,99,235,.35);
}

.primary-button:disabled {
  opacity: .6;
  cursor: not-allowed;
  transform: none;
}

#loginMessage {
  min-height: 20px;

  margin-top: -8px;
  margin-bottom: 8px;

  font-size: 12px;
}

.error-message {
  color: #f87171;
}

.success-message {
  color: #34d399;
}

.security-note {
  margin-top: 28px;

  text-align: center;

  color: #64748b;

  font-size: 11px;
}


/* TEMP APP */

.app-page {
  min-height: 100vh;
  padding: 60px;
}


/* ================= RESPONSIVE ================= */

@media(max-width:850px) {

  .login-wrapper {
    grid-template-columns: 1fr;
  }

  .brand-panel {
    display: none;
  }

  .login-panel {
    border-left: none;
    padding: 45px 25px;
  }

  .mobile-logo {
    display: flex;
  }

}

/* =====================================================
   SIDSS APPLICATION
===================================================== */

.dashboard-app {
  min-height: 100vh;
  background: #020617;
  display: flex;
}


/* SIDEBAR */

.sidebar {
  width: 255px;
  height: 100vh;

  position: fixed;
  left: 0;
  top: 0;

  display: flex;
  flex-direction: column;

  padding: 24px 17px;

  background: #08111f;

  border-right:
    1px solid rgba(148,163,184,.10);

  z-index: 100;
}

.sidebar-brand {
  display: flex;
  align-items: center;
  gap: 12px;

  padding: 4px 8px 25px;

  border-bottom:
    1px solid rgba(148,163,184,.10);
}

.sidebar-logo {
  width: 63px;
  height: 43px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 12px;

  font-size: 20px;
  font-weight: 800;

  background:
    linear-gradient(135deg,#2563eb,#06b6d4);
}

.sidebar-brand h2 {
  font-size: 18px;
  letter-spacing: .5px;
}

.sidebar-brand-text span {

  display: block;

  color: #64748b;

  font-size: 8px;
  font-weight: 600;

  line-height: 1.6;

  text-transform: uppercase;

  letter-spacing: .7px;
}


.sidebar-user {
  display: flex;
  align-items: center;
  gap: 11px;

  padding: 18px 8px;
}

.user-avatar,
.top-avatar {

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  font-weight: 700;

  background:
    linear-gradient(135deg,#1d4ed8,#0891b2);
}

.user-avatar {
  width: 37px;
  height: 37px;

  font-size: 13px;
}

.sidebar-user div:last-child {
  min-width: 0;
}

.sidebar-user strong {
  display: block;

  max-width: 150px;

  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;

  font-size: 11px;
}

.sidebar-user span {
  display: block;

  color: #64748b;

  margin-top: 3px;

  font-size: 9px;
}


/* NAVIGATION */

.sidebar nav {
  flex: 1;

  overflow-y: auto;

  padding-top: 8px;
}

.nav-item {

  width: 100%;

  display: flex;
  align-items: center;
  gap: 12px;

  padding: 11px 13px;

  margin-bottom: 4px;

  border: none;
  border-radius: 9px;

  background: transparent;

  color: #94a3b8;

  cursor: pointer;

  font-family: inherit;
  font-size: 11px;
  font-weight: 500;

  text-align: left;

  transition: .18s;
}

.nav-item span {
  width: 19px;

  color: #64748b;

  font-size: 15px;

  text-align: center;
}

.nav-item:hover {
  background: rgba(30,41,59,.65);
  color: #e2e8f0;
}

.nav-item.active {

  color: white;

  background:
    linear-gradient(
      90deg,
      rgba(37,99,235,.25),
      rgba(8,145,178,.10)
    );

  border:
    1px solid rgba(59,130,246,.15);
}

.nav-item.active span {
  color: #60a5fa;
}


.sidebar-bottom {

  padding-top: 13px;

  border-top:
    1px solid rgba(148,163,184,.10);
}

.logout-button {

  width: 100%;

  padding: 10px;

  border: none;
  border-radius: 8px;

  background: transparent;

  color: #f87171;

  cursor: pointer;

  font-family: inherit;
  font-size: 11px;

  text-align: left;
}


/* MAIN */

.main-area {
  width: calc(100% - 255px);
  min-height: 100vh;

  margin-left: 255px;
}


/* TOP BAR */

.topbar {

  height: 72px;

  position: sticky;
  top: 0;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 30px;

  background:
    rgba(2,6,23,.86);

  backdrop-filter: blur(15px);

  border-bottom:
    1px solid rgba(148,163,184,.10);

  z-index: 50;
}

.breadcrumb {
  color: #64748b;
  font-size: 11px;
}

.breadcrumb span {
  color: #cbd5e1;
}


.topbar-actions {
  display: flex;
  align-items: center;
  gap: 15px;
}


.global-search {

  width: 250px;
  height: 37px;

  display: flex;
  align-items: center;
  gap: 9px;

  padding: 0 12px;

  border-radius: 9px;

  background: #0f172a;

  border:
    1px solid rgba(148,163,184,.12);
}

.global-search span {
  color: #64748b;
}

.global-search input {

  width: 100%;

  border: none;
  outline: none;

  background: transparent;

  color: white;

  font-family: inherit;
  font-size: 11px;
}

.icon-button {

  width: 37px;
  height: 37px;

  border: 1px solid rgba(148,163,184,.12);
  border-radius: 9px;

  background: #0f172a;

  cursor: pointer;
}


.top-user {
  display: flex;
  align-items: center;
  gap: 9px;

  padding-left: 14px;

  border-left:
    1px solid rgba(148,163,184,.12);
}

.top-avatar {
  width: 34px;
  height: 34px;

  font-size: 11px;
}

.top-user strong {
  display: block;

  font-size: 10px;
}

.top-user span {
  display: block;

  color: #64748b;

  margin-top: 2px;

  font-size: 8px;
}


/* MAIN CONTENT */

.main-content {
  padding: 30px;

  min-height:
    calc(100vh - 72px);
}


/* LOADING */

.dashboard-loading {

  height: 400px;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  color: #64748b;

  font-size: 12px;
}

.loader {

  width: 34px;
  height: 34px;

  margin-bottom: 15px;

  border-radius: 50%;

  border: 3px solid #1e293b;

  border-top-color: #3b82f6;

  animation:
    sidssSpin .8s linear infinite;
}

@keyframes sidssSpin {

  to {
    transform: rotate(360deg);
  }

}


/* RESPONSIVE */

@media(max-width:900px) {

  .sidebar {
    width: 75px;
  }

  .sidebar-brand div:last-child,
  .sidebar-user div:last-child,
  .nav-item:not(.active) {
  }

  .sidebar-brand h2,
  .sidebar-brand span,
  .sidebar-user div:last-child,
  .nav-item {
    font-size: 0;
  }

  .nav-item span {
    font-size: 17px;
  }

  .main-area {
    width: calc(100% - 75px);
    margin-left: 75px;
  }

  .global-search {
    display: none;
  }

}

/* =====================================================
   DASHBOARD CONTENT
===================================================== */

.dashboard-header {
  display: flex;
  align-items: center;
  justify-content: space-between;

  margin-bottom: 28px;
}

.dashboard-eyebrow,
.section-label {

  color: #60a5fa;

  font-size: 9px;
  font-weight: 800;

  letter-spacing: 1.4px;
}

.dashboard-header h1 {

  margin-top: 7px;

  font-size: 28px;

  letter-spacing: -.7px;
}

.dashboard-header > div > p:last-child {

  margin-top: 7px;

  color: #64748b;

  font-size: 11px;
}

.scope-badge {

  display: flex;
  align-items: center;
  gap: 8px;

  padding: 9px 14px;

  border-radius: 50px;

  background: rgba(16,185,129,.08);

  border:
    1px solid rgba(16,185,129,.18);

  color: #6ee7b7;

  font-size: 10px;
  font-weight: 600;
}

.scope-badge span {

  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: #10b981;

  box-shadow:
    0 0 10px #10b981;
}


/* STATS */

.stats-grid {

  display: grid;

  grid-template-columns:
    repeat(4,1fr);

  gap: 16px;

  margin-bottom: 18px;
}

.stat-card {

  min-height: 160px;

  padding: 19px;

  border-radius: 14px;

  background:
    linear-gradient(
      145deg,
      rgba(15,23,42,.95),
      rgba(8,17,31,.95)
    );

  border:
    1px solid rgba(148,163,184,.10);
}

.stat-top {

  display: flex;
  justify-content: space-between;

  margin-bottom: 18px;
}

.stat-icon {

  width: 36px;
  height: 36px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 9px;

  background:
    rgba(59,130,246,.10);

  font-size: 15px;
}

.stat-live {

  color: #475569;

  font-size: 7px;
  font-weight: 800;

  letter-spacing: 1px;
}

.stat-card h2 {

  margin-bottom: 5px;

  font-size: 25px;
}

.stat-card strong {

  display: block;

  font-size: 10px;
}

.stat-card p {

  margin-top: 5px;

  color: #64748b;

  font-size: 9px;
}


/* DASHBOARD CARDS */

.dashboard-grid {

  display: grid;

  grid-template-columns:
    1.6fr 1fr;

  gap: 18px;

  margin-bottom: 18px;
}

.dashboard-card {

  padding: 20px;

  border-radius: 14px;

  background:
    #08111f;

  border:
    1px solid rgba(148,163,184,.10);
}

.card-heading {

  display: flex;
  justify-content: space-between;
  align-items: center;

  margin-bottom: 24px;
}

.card-heading h3 {

  margin-top: 5px;

  font-size: 14px;
}

.live-badge {

  padding: 6px 9px;

  border-radius: 20px;

  background:
    rgba(16,185,129,.08);

  color: #34d399;

  font-size: 7px;
  font-weight: 800;

  letter-spacing: 1px;
}


/* PERFORMANCE */

.performance-row {

  margin-bottom: 21px;
}

.performance-info {

  display: flex;
  justify-content: space-between;

  margin-bottom: 8px;

  font-size: 10px;
}

.performance-info span {

  color: #94a3b8;
}

.performance-info strong {

  font-size: 9px;
}

.progress-track {

  height: 6px;

  overflow: hidden;

  border-radius: 10px;

  background: #172033;
}

.progress-value {

  height: 100%;

  border-radius: 10px;

  background:
    linear-gradient(
      90deg,
      #2563eb,
      #06b6d4
    );
}


/* QUICK ACCESS */

.quick-grid {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 10px;
}

.quick-grid button {

  min-height: 82px;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  gap: 8px;

  border-radius: 10px;

  border:
    1px solid rgba(148,163,184,.10);

  background: #0f172a;

  color: #cbd5e1;

  cursor: pointer;

  font-family: inherit;
  font-size: 9px;

  transition: .2s;
}

.quick-grid button:hover {

  transform: translateY(-2px);

  border-color:
    rgba(59,130,246,.35);

  background:
    rgba(30,41,59,.8);
}

.quick-grid button span {

  font-size: 19px;
}


/* COVERAGE */

.coverage-grid {

  display: grid;

  grid-template-columns:
    repeat(3,1fr);

  gap: 12px;
}

.coverage-grid div {

  padding: 14px;

  border-radius: 10px;

  background: #0f172a;

  text-align: center;
}

.coverage-grid strong {

  display: block;

  margin-bottom: 5px;

  font-size: 18px;
}

.coverage-grid span {

  color: #64748b;

  font-size: 8px;
}


/* SESSION */

.session-info {

  display: grid;

  gap: 10px;
}

.session-info div {

  display: flex;
  justify-content: space-between;

  padding: 10px 0;

  border-bottom:
    1px solid rgba(148,163,184,.08);

  font-size: 9px;
}

.session-info span {

  color: #64748b;
}

.online-text {

  color: #34d399;
}


/* RESPONSIVE */

@media(max-width:1100px) {

  .stats-grid {
    grid-template-columns:
      repeat(2,1fr);
  }

}

@media(max-width:750px) {

  .dashboard-grid {
    grid-template-columns:1fr;
  }

  .stats-grid {
    grid-template-columns:1fr;
  }

}

/* =====================================================
   STUDENTS MODULE
===================================================== */

.module-header {

  display: flex;
  justify-content: space-between;
  align-items: center;

  margin-bottom: 24px;
}

.module-header h1 {

  margin-top: 6px;

  font-size: 27px;
}

.module-header > div > p:last-child {

  margin-top: 6px;

  color: #64748b;

  font-size: 10px;
}


.student-count-badge {

  min-width: 105px;

  padding: 12px 18px;

  border-radius: 12px;

  background:
    rgba(37,99,235,.08);

  border:
    1px solid rgba(59,130,246,.16);
}

.student-count-badge strong {

  display: block;

  font-size: 19px;
}

.student-count-badge span {

  color: #64748b;

  font-size: 8px;
}


.student-toolbar {

  display: flex;
  align-items: center;
  justify-content: space-between;

  margin-bottom: 15px;
}


.student-search {

  width: 360px;
  height: 40px;

  display: flex;
  align-items: center;

  gap: 10px;

  padding: 0 13px;

  border-radius: 9px;

  background: #0f172a;

  border:
    1px solid rgba(148,163,184,.12);
}

.student-search span {

  color: #64748b;
}

.student-search input {

  width: 100%;

  border: none;
  outline: none;

  background: transparent;

  color: white;

  font-family: inherit;

  font-size: 10px;
}


.students-table-card {

  overflow: hidden;

  border-radius: 14px;

  background: #08111f;

  border:
    1px solid rgba(148,163,184,.10);
}


.table-header {

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 19px 20px;

  border-bottom:
    1px solid rgba(148,163,184,.08);
}

.table-header h3 {

  margin-top: 5px;

  font-size: 13px;
}

.table-header > span {

  color: #64748b;

  font-size: 9px;
}


.table-responsive {

  overflow-x: auto;
}


.students-table {

  width: 100%;

  border-collapse: collapse;
}


.students-table th {

  padding: 13px 15px;

  color: #64748b;

  background: #0b1424;

  font-size: 7px;
  font-weight: 700;

  letter-spacing: .8px;

  text-align: left;
}


.students-table td {

  padding: 13px 15px;

  border-top:
    1px solid rgba(148,163,184,.06);

  color: #94a3b8;

  font-size: 9px;
}


.students-table tbody tr {

  transition: .15s;
}


.students-table tbody tr:hover {

  background:
    rgba(30,41,59,.40);
}


.student-name-cell {

  display: flex;
  align-items: center;

  gap: 10px;
}


.student-avatar {

  width: 32px;
  height: 32px;

  flex-shrink: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 9px;

  background:
    linear-gradient(
      135deg,
      #1d4ed8,
      #0891b2
    );

  color: white;

  font-size: 10px;
  font-weight: 700;
}


.student-name-cell strong {

  display: block;

  color: #e2e8f0;

  font-size: 9px;
}


.student-name-cell span {

/* =====================================================
   CLICKABLE PLACEMENT KPI
===================================================== */

.clickable-kpi {
  cursor: pointer;
  position: relative;
  transition:
    transform .20s ease,
    border-color .20s ease,
    box-shadow .20s ease,
    background .20s ease;
}

.clickable-kpi:hover {
  transform: translateY(-3px);

  border-color:
    rgba(59, 130, 246, .45);

  background:
    linear-gradient(
      145deg,
      #0a1526,
      #08111f
    );

  box-shadow:
    0 12px 35px
    rgba(0, 0, 0, .20);
}

.clickable-kpi:active {
  transform: translateY(-1px);
}

.clickable-kpi::after {
  content: 'CLICK TO VIEW';

  position: absolute;

  right: 16px;
  bottom: 12px;

  color: #3b82f6;

  font-size: 6px;
  font-weight: 800;

  letter-spacing: .8px;

  opacity: 0;

  transition: opacity .20s ease;
}

.clickable-kpi:hover::after {
  opacity: 1;
}

/* =========================================
   FACULTY STUDENT INFORMATION
   ========================================= */

.faculty-student-card {
  position: relative;
  overflow: hidden;
  animation: facultyCardIn 0.55s ease both;
}


.faculty-student-card::before {
  content: "";
  position: absolute;
  top: -120px;
  right: -120px;
  width: 260px;
  height: 260px;
  border-radius: 50%;
  background: rgba(37, 99, 235, 0.08);
  filter: blur(30px);
  pointer-events: none;
}


.faculty-student-card::after {
  content: "";
  position: absolute;
  bottom: -100px;
  left: -100px;
  width: 220px;
  height: 220px;
  border-radius: 50%;
  background: rgba(6, 182, 212, 0.06);
  filter: blur(35px);
  pointer-events: none;
}


.student-card-top {
  position: relative;
  z-index: 2;

  display: flex;
  align-items: flex-start;
  justify-content: space-between;

  gap: 20px;

  padding-bottom: 22px;

  border-bottom: 1px solid rgba(255,255,255,0.08);
}


.faculty-student-name {
  margin: 7px 0 4px;

  font-size: 25px;
  font-weight: 700;

  letter-spacing: -0.4px;

  color: #f8fafc;
}


.student-subtitle {
  margin: 0;

  font-size: 13px;

  color: #64748b;
}


.student-status-badge {
  display: flex;
  align-items: center;
  gap: 8px;

  padding: 8px 13px;

  border-radius: 999px;

  border: 1px solid rgba(34,197,94,0.18);

  background: rgba(34,197,94,0.07);

  color: #86efac;

  font-size: 11px;
  font-weight: 600;

  white-space: nowrap;
}


.status-dot {
  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: #22c55e;

  box-shadow:
    0 0 0 4px rgba(34,197,94,0.08),
    0 0 12px rgba(34,197,94,0.45);

  animation: statusPulse 2s infinite;
}


/* =========================================
   STUDENT INFO GRID
   ========================================= */

.student-info-grid {

  position: relative;
  z-index: 2;

  display: grid;

  grid-template-columns:
    repeat(5, minmax(0, 1fr));

  gap: 12px;

  margin-top: 22px;
}


.student-info-item {

  min-height: 78px;

  padding: 15px;

  border-radius: 13px;

  border: 1px solid rgba(255,255,255,0.06);

  background:
    linear-gradient(
      145deg,
      rgba(30,41,59,0.72),
      rgba(15,23,42,0.62)
    );

  transition:
    transform 0.25s ease,
    border-color 0.25s ease,
    background 0.25s ease,
    box-shadow 0.25s ease;

  animation: infoItemIn 0.5s ease both;
}


.student-info-item:nth-child(1) {
  animation-delay: 0.05s;
}

.student-info-item:nth-child(2) {
  animation-delay: 0.10s;
}

.student-info-item:nth-child(3) {
  animation-delay: 0.15s;
}

.student-info-item:nth-child(4) {
  animation-delay: 0.20s;
}

.student-info-item:nth-child(5) {
  animation-delay: 0.25s;
}


.student-info-item:hover {

  transform: translateY(-3px);

  border-color: rgba(56,189,248,0.20);

  background:
    linear-gradient(
      145deg,
      rgba(30,41,59,0.92),
      rgba(15,23,42,0.80)
    );

  box-shadow:
    0 10px 25px rgba(0,0,0,0.18);
}


.info-label {

  display: block;

  margin-bottom: 9px;

  font-size: 9px;

  font-weight: 600;

  letter-spacing: 0.9px;

  color: #64748b;
}


.student-info-item strong {

  display: block;

  font-size: 14px;

  font-weight: 650;

  color: #e2e8f0;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}


/* =========================================
   SUBJECT BADGE
   ========================================= */

.subject-badge {

  position: relative;

  display: inline-flex;

  align-items: center;

  gap: 7px;

  padding: 7px 12px;

  border-radius: 999px;

  border: 1px solid rgba(16,185,129,0.20);

  background: rgba(16,185,129,0.07);

  color: #6ee7b7;

  font-size: 10px;

  font-weight: 600;
}


.subject-badge::before {

  content: "";

  width: 6px;
  height: 6px;

  border-radius: 50%;

  background: #10b981;

  box-shadow:
    0 0 8px rgba(16,185,129,0.65);

}


/* =========================================
   ANIMATIONS
   ========================================= */

@keyframes facultyCardIn {

  from {

    opacity: 0;

    transform:
      translateY(14px)
      scale(0.985);

  }

  to {

    opacity: 1;

    transform:
      translateY(0)
      scale(1);

  }

}


@keyframes infoItemIn {

  from {

    opacity: 0;

    transform:
      translateY(10px);

  }

  to {

    opacity: 1;

    transform:
      translateY(0);

  }

}


@keyframes statusPulse {

  0%,
  100% {

    opacity: 1;

  }

  50% {

    opacity: 0.45;

  }

}

@media (max-width: 1100px) {

  .student-info-grid {
    grid-template-columns: repeat(3, 1fr);
  }

}


@media (max-width: 700px) {

  .student-card-top {
    flex-direction: column;
  }

  .student-info-grid {
    grid-template-columns: repeat(2, 1fr);
  }

}


@media (max-width: 480px) {

  .student-info-grid {
    grid-template-columns: 1fr;
  }

}

/* =========================================
   MARKS SAVED - PREMIUM SUCCESS ANIMATION
   ========================================= */

.marks-actions {
  position: relative;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
}

/* Success message */
.save-success-message {
  flex-basis: 100%;
  width: 100%;
  height: 0;
  min-height: 0;
  overflow: hidden;

  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;

  margin: 0;
  opacity: 0;
  transform: translateY(12px) scale(0.96);

  font-size: 14px;
  font-weight: 600;
  text-align: center;

  color: #00d9a5;

  transition:
    opacity 0.35s ease,
    transform 0.35s ease,
    height 0.35s ease,
    margin 0.35s ease;
}

/* Visible state */
.save-success-message.show {
  height: 30px;
  margin-bottom: 12px;

  opacity: 1;
  transform: translateY(0) scale(1);

  animation: successMessageIn 0.45s ease forwards;
}

/* Animated check circle */
.save-success-message .success-icon {
  width: 22px;
  height: 22px;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  background: rgba(0, 217, 165, 0.15);
  border: 1px solid rgba(0, 217, 165, 0.35);

  font-size: 13px;
  font-weight: 700;

  animation: successIconPop 0.55s cubic-bezier(.17,.67,.3,1.3);
}

/* Message entrance */
@keyframes successMessageIn {

  0% {
    opacity: 0;
    transform: translateY(15px) scale(0.94);
  }

  60% {
    opacity: 1;
    transform: translateY(-3px) scale(1.02);
  }

  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* Check animation */
@keyframes successIconPop {

  0% {
    transform: scale(0);
    opacity: 0;
  }

  55% {
    transform: scale(1.25);
    opacity: 1;
  }

  75% {
    transform: scale(0.9);
  }

  100% {
    transform: scale(1);
  }
}


/* Save button / success message */

.marks-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* Hidden by default */
.save-success-message {
  display: none;

  height: 52px;
  flex: 1;

  align-items: center;
  justify-content: center;
  gap: 9px;

  border-radius: 8px;

  background: rgba(0, 220, 160, 0.08);
  border: 1px solid rgba(0, 220, 160, 0.35);

  color: #00d9a5;

  font-size: 15px;
  font-weight: 600;

  opacity: 0;
  transform: scale(0.94);

  box-sizing: border-box;
}

/* Show success message */
.save-success-message.show {
  display: flex;

  animation: saveSuccessIn 0.4s ease forwards;
}

/* Check icon */
.success-check {
  width: 24px;
  height: 24px;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  background: rgba(0, 220, 160, 0.16);
  border: 1px solid rgba(0, 220, 160, 0.4);

  animation: successCheckPop 0.55s cubic-bezier(.17,.67,.3,1.3);
}

/* Message comes in */
@keyframes saveSuccessIn {

  0% {
    opacity: 0;
    transform: scale(0.94);
  }

  60% {
    opacity: 1;
    transform: scale(1.02);
  }

  100% {
    opacity: 1;
    transform: scale(1);
  }

}

/* Check pops */
@keyframes successCheckPop {

  0% {
    transform: scale(0);
  }

  60% {
    transform: scale(1.25);
  }

  100% {
    transform: scale(1);
  }

}

/* Message disappears */
.save-success-message.hide {
  animation: saveSuccessOut 0.3s ease forwards;
}

@keyframes saveSuccessOut {

  0% {
    opacity: 1;
    transform: scale(1);
  }

  100% {
    opacity: 0;
    transform: scale(0.94);
  }

}

.save-loading,
.save-success,
.save-button-content {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
}

.loading-spinner {
  width: 16px;
  height: 16px;
  border: 2px solid rgba(255,255,255,0.35);
  border-top-color: #ffffff;
  border-radius: 50%;
  animation: saveSpin 0.7s linear infinite;
}

@keyframes saveSpin {
  to {
    transform: rotate(360deg);
  }
}

.save-success {
  animation: saveSuccess 0.35s ease-out;
}

@keyframes saveSuccess {

  0% {
    opacity: 0;
    transform: scale(0.92);
  }

  60% {
    opacity: 1;
    transform: scale(1.04);
  }

  100% {
    opacity: 1;
    transform: scale(1);
  }

}

/* =========================================================
   SIDSS FACULTY MARKS ENTRY — PREMIUM UI
   FUNCTIONALITY SAFE: CSS ONLY
   ========================================================= */


/* ---------------------------------------------------------
   MAIN MARKS SECTION
   --------------------------------------------------------- */

.marks-section {
  margin-top: 18px;
  padding: 28px;
  border: 1px solid rgba(148, 163, 184, 0.12);
  border-radius: 22px;
  background:
    linear-gradient(
      145deg,
      rgba(20, 31, 50, 0.96),
      rgba(12, 22, 39, 0.96)
    );
  box-shadow:
    0 20px 50px rgba(0, 0, 0, 0.22),
    inset 0 1px 0 rgba(255, 255, 255, 0.025);
}


/* ---------------------------------------------------------
   SECTION TITLE
   --------------------------------------------------------- */

.marks-section h3,
.marks-result-section h3 {
  margin: 0 0 22px;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.02em;
  color: #f8fafc;
}


/* ---------------------------------------------------------
   INPUT GRID
   --------------------------------------------------------- */

.marks-input-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}


/* ---------------------------------------------------------
   INPUT CARD
   --------------------------------------------------------- */

.marks-input-group {
  position: relative;
  min-height: 112px;
  padding: 18px;
  border-radius: 16px;

  background:
    linear-gradient(
      145deg,
      rgba(30, 43, 64, 0.98),
      rgba(20, 32, 51, 0.98)
    );

  border: 1px solid rgba(148, 163, 184, 0.12);

  box-shadow:
    0 8px 24px rgba(0, 0, 0, 0.16),
    inset 0 1px 0 rgba(255, 255, 255, 0.025);

  transition:
    transform 0.2s ease,
    border-color 0.2s ease,
    box-shadow 0.2s ease;
}


.marks-input-group:hover {
  transform: translateY(-2px);

  border-color:
    rgba(59, 130, 246, 0.30);

  box-shadow:
    0 12px 30px rgba(0, 0, 0, 0.22),
    0 0 0 1px rgba(59, 130, 246, 0.04);
}


/* ---------------------------------------------------------
   LABEL
   --------------------------------------------------------- */

.marks-input-group label {
  display: flex;
  align-items: center;
  justify-content: space-between;

  margin-bottom: 10px;

  font-size: 12px;
  font-weight: 700;

  color: #cbd5e1;
}


.marks-input-group label span {
  font-size: 11px;
  font-weight: 600;
  color: #64748b;
}


/* ---------------------------------------------------------
   INPUT
   --------------------------------------------------------- */

.marks-input-group input {
  width: 100%;
  height: 46px;

  box-sizing: border-box;

  padding: 0 14px;

  border-radius: 11px;

  border: 1px solid rgba(148, 163, 184, 0.16);

  outline: none;

  background:
    rgba(8, 16, 30, 0.90);

  color: #f8fafc;

  font-size: 15px;
  font-weight: 700;

  transition:
    border-color 0.2s ease,
    box-shadow 0.2s ease,
    background 0.2s ease;
}


.marks-input-group input::placeholder {
  color: #475569;
  font-weight: 500;
}


.marks-input-group input:focus {
  border-color: #3b82f6;

  background:
    rgba(10, 20, 38, 0.98);

  box-shadow:
    0 0 0 3px rgba(59, 130, 246, 0.12),
    0 8px 20px rgba(0, 0, 0, 0.18);
}


/* ---------------------------------------------------------
   SMALL RANGE TEXT
   --------------------------------------------------------- */

.marks-input-group small {
  display: block;

  margin-top: 8px;

  font-size: 10px;
  font-weight: 600;

  color: #64748b;
}


/* ---------------------------------------------------------
   DISABLED COMPONENT
   --------------------------------------------------------- */

.marks-input-group input:disabled {
  cursor: not-allowed;

  opacity: 0.55;

  background:
    rgba(15, 23, 42, 0.65);

  border-color:
    rgba(148, 163, 184, 0.08);
}


/* ---------------------------------------------------------
   EXTERNAL — READ ONLY
   --------------------------------------------------------- */

#facultyExternal {
  border-color:
    rgba(34, 211, 238, 0.22);

  background:
    linear-gradient(
      135deg,
      rgba(8, 30, 45, 0.95),
      rgba(8, 22, 37, 0.95)
    );

  color: #67e8f9;
}


#facultyExternal:focus {
  border-color:
    rgba(34, 211, 238, 0.45);

  box-shadow:
    0 0 0 3px rgba(34, 211, 238, 0.10);
}


/* ---------------------------------------------------------
   CALCULATED RESULT SECTION
   --------------------------------------------------------- */

.marks-result-section {
  margin-top: 22px;
  padding: 24px;

  border-radius: 22px;

  background:
    linear-gradient(
      145deg,
      rgba(15, 28, 48, 0.98),
      rgba(10, 20, 36, 0.98)
    );

  border: 1px solid rgba(59, 130, 246, 0.12);

  box-shadow:
    0 18px 45px rgba(0, 0, 0, 0.20),
    inset 0 1px 0 rgba(255, 255, 255, 0.025);
}


/* ---------------------------------------------------------
   RESULT GRID
   --------------------------------------------------------- */

.marks-result-grid {
  display: grid;

  grid-template-columns:
    repeat(5, minmax(0, 1fr));

  gap: 14px;
}


/* ---------------------------------------------------------
   RESULT CARD
   --------------------------------------------------------- */

.marks-result-grid > div {
  position: relative;

  min-height: 92px;

  padding: 16px;

  box-sizing: border-box;

  display: flex;
  flex-direction: column;
  justify-content: space-between;

  border-radius: 15px;

  background:
    rgba(18, 31, 51, 0.88);

  border: 1px solid rgba(148, 163, 184, 0.10);

  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.025);

  overflow: hidden;
}


/* subtle top glow */

.marks-result-grid > div::before {
  content: "";

  position: absolute;

  top: 0;
  left: 0;

  width: 100%;
  height: 2px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(59, 130, 246, 0.75),
      transparent
    );

  opacity: 0.75;
}


/* ---------------------------------------------------------
   RESULT LABEL
   --------------------------------------------------------- */

.marks-result-grid span {
  font-size: 10px;

  font-weight: 700;

  letter-spacing: 0.06em;

  text-transform: uppercase;

  color: #64748b;
}


/* ---------------------------------------------------------
   RESULT VALUE
   --------------------------------------------------------- */

.marks-result-grid strong {
  display: block;

  margin-top: 10px;

  font-size: 25px;

  line-height: 1;

  font-weight: 800;

  letter-spacing: -0.02em;

  color: #f8fafc;
}


/* ---------------------------------------------------------
   CIE
   --------------------------------------------------------- */

#facultyCIE {
  color: #60a5fa;
}


/* ---------------------------------------------------------
   EXTERNAL REDUCED
   --------------------------------------------------------- */

#facultyExternalReduced {
  color: #67e8f9;
}


/* ---------------------------------------------------------
   TOTAL — MOST IMPORTANT
   --------------------------------------------------------- */

.marks-result-grid > div:nth-child(4) {
  border-color:
    rgba(59, 130, 246, 0.25);

  background:
    linear-gradient(
      145deg,
      rgba(25, 55, 100, 0.42),
      rgba(17, 35, 65, 0.60)
    );

  box-shadow:
    0 10px 30px rgba(37, 99, 235, 0.10),
    inset 0 1px 0 rgba(255, 255, 255, 0.03);
}


#facultyTotal {
  font-size: 29px;

  color: #ffffff;
}


/* ---------------------------------------------------------
   RESULT STATUS
   --------------------------------------------------------- */

#facultyResult {
  font-size: 26px !important;
  font-weight: 700 !important;
  line-height: 1.2;
  display: inline-block;
}


/* ---------------------------------------------------------
   BUTTON AREA
   --------------------------------------------------------- */

.faculty-modal-actions {
  display: grid;

  grid-template-columns:
    120px minmax(0, 1fr);

  gap: 12px;

  margin-top: 22px;
}


/* ---------------------------------------------------------
   BUTTONS
   --------------------------------------------------------- */

.faculty-modal-actions button {
  min-height: 48px;

  border: none;

  border-radius: 12px;

  font-size: 13px;

  font-weight: 700;

  cursor: pointer;

  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease,
    opacity 0.2s ease;
}


.faculty-modal-actions button:hover {
  transform: translateY(-1px);
}


.faculty-modal-actions button:active {
  transform: translateY(0);
}


/* ---------------------------------------------------------
   PRIMARY BUTTON
   --------------------------------------------------------- */

.faculty-modal-actions .primary-btn {
  color: white;

  background:
    linear-gradient(
      135deg,
      #2563eb,
      #06b6d4
    );

  box-shadow:
    0 8px 25px rgba(37, 99, 235, 0.22);
}


.faculty-modal-actions .primary-btn:hover {
  box-shadow:
    0 12px 32px rgba(37, 99, 235, 0.32);
}


/* ---------------------------------------------------------
   SECONDARY BUTTON
   --------------------------------------------------------- */

.faculty-modal-actions .secondary-btn {
  color: #cbd5e1;

  background:
    rgba(30, 41, 59, 0.95);

  border:
    1px solid rgba(148, 163, 184, 0.12);
}


.faculty-modal-actions .secondary-btn:hover {
  background:
    rgba(51, 65, 85, 0.95);
}


/* ---------------------------------------------------------
   RESPONSIVE — TABLET
   --------------------------------------------------------- */

@media (max-width: 1050px) {

  .marks-input-grid {
    grid-template-columns:
      repeat(2, minmax(0, 1fr));
  }

  .marks-result-grid {
    grid-template-columns:
      repeat(3, minmax(0, 1fr));
  }

}


/* ---------------------------------------------------------
   RESPONSIVE — MOBILE
   --------------------------------------------------------- */

@media (max-width: 700px) {

  .marks-section,
  .marks-result-section {
    padding: 18px;

    grid-template-columns: 1fr;
